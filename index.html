    });

    document.getElementById('btn-play-again').addEventListener('click', () => {
      sound.playClick(720);
      document.getElementById('summary-modal').classList.add('hidden');
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    });

    // =========================================================================
    // 13. TURN & HOLE RESOLUTION LOGIC
    // =========================================================================
    function getGolfTerm(strokes, par) {
      if (strokes === 1) return 'HOLE IN ONE!';
      const diff = strokes - par;
      if (diff <= -2) return 'Eagle!';
      if (diff === -1) return 'Birdie!';
      if (diff === 0) return 'Par';
      if (diff === 1) return 'Bogey';
      if (diff === 2) return 'Double Bogey';
      return `+${diff}`;
    }

    function advanceTurnAfterLanding() {
      const hole = state.holes[state.currentHoleIndex];

      // Check if all players have holed out on the current hole
      const allHoled = state.players.slice(0, state.playerCount).every(p => p.holedOut);
      if (allHoled) {
        showHoleOrRoundSummary();
        return;
      }

      // Golf Rule: Player farthest from the pin throws next among players not yet holed out
      let farthestIdx = -1;
      let maxDist = -1;
      for (let i = 0; i < state.playerCount; i++) {
        const p = state.players[i];
        if (p.holedOut) continue;
        const d = Math.hypot(p.lie.x - hole.pinPos.x, p.lie.z - hole.pinPos.z);
        if (d > maxDist) {
          maxDist = d;
          farthestIdx = i;
        }
      }

      state.currentPlayerIndex = farthestIdx >= 0 ? farthestIdx : 0;
      randomizeWindForHole(true);
      preparePlayerTurn();
    }

    function showHoleOrRoundSummary() {
      const isLastHole = state.currentHoleIndex >= state.totalHoles - 1;
      const hole = state.holes[state.currentHoleIndex];

      state.phase = isLastHole ? 'GAME_OVER' : 'HOLE_SUMMARY';

      const badge = document.getElementById('summary-badge');
      const title = document.getElementById('summary-title');
      const body = document.getElementById('summary-body');
      const btnNext = document.getElementById('btn-next-hole');
      const btnAgain = document.getElementById('btn-play-again');

      if (!isLastHole) {
        badge.textContent = `HOLE ${hole.number} COMPLETE • PAR ${hole.par}`;
        if (state.playerCount === 1) {
          const strokes = state.players[0].scores[state.currentHoleIndex];
          title.textContent = getGolfTerm(strokes, hole.par);
        } else {
          title.textContent = 'Hole Standings';
        }
        body.innerHTML = `<div style="overflow-x:auto;"><table class="score-table">${buildScorecardTableHTML()}</table></div>`;
        btnNext.style.display = 'inline-flex';
        btnAgain.style.display = 'none';
      } else {
        badge.textContent = 'TOURNAMENT COMPLETE';
        // Find winner (lowest total score)
        let bestScore = Infinity;
        let winnerName = state.players[0].name;
        for (let i = 0; i < state.playerCount; i++) {
          const sum = state.players[i].scores.reduce((a, b) => a + (b || 0), 0);
          if (sum < bestScore) {
            bestScore = sum;
            winnerName = state.players[i].name;
          }
        }
        title.textContent = state.playerCount === 1 ? `Final Score: ${bestScore}` : `${winnerName} Wins!`;
        body.innerHTML = `<div style="overflow-x:auto;"><table class="score-table">${buildScorecardTableHTML()}</table></div>`;
        btnNext.style.display = 'none';
        btnAgain.style.display = 'inline-flex';
      }

      document.getElementById('summary-modal').classList.remove('hidden');
    }

    // =========================================================================
    // 14. MAIN SIMULATION & RENDER LOOP (60 FPS)
    // =========================================================================
    const clock = new THREE.Clock();
    const camTargetPos = new THREE.Vector3();
    const camLookAtPos = new THREE.Vector3();

    function updatePhysics(dt) {
      if (state.phase !== 'FLYING') return;

      const hole = state.holes[state.currentHoleIndex];
      const player = state.players[state.currentPlayerIndex];
      const model = PLANE_MODELS[player.modelId];
      const f = state.flight;

      f.timeInAir += dt;

      // Sub-step physics (3 steps per frame) to prevent tunneling through rooftops or terrain
      const subSteps = 3;
      const subDt = dt / subSteps;

      for (let step = 0; step < subSteps; step++) {
        const speed = f.vel.length();
        const horizSpeed = Math.hypot(f.vel.x, f.vel.z);

        // Wing lift increases with airspeed, countered by gravity
        const liftAccel = Math.min(8.85, horizSpeed * 0.25 * model.liftMult);
        let verticalAccel = -9.81 + liftAccel;

        // Check Thermal Updrafts
        for (const th of hole.thermals) {
          if (Math.hypot(f.pos.x - th.x, f.pos.z - th.z) <= th.radius) {
            verticalAccel += 7.5;
          }
        }

        f.vel.y += verticalAccel * subDt;

        // Apply 3D Wind Drift
        f.vel.addScaledVector(state.wind.vec, 0.16 * model.windSensitivity * subDt);

        // Air Drag
        const dragFactor = Math.max(0, 1 - 0.16 * model.dragMult * subDt);
        f.vel.multiplyScalar(dragFactor);

        // Gentle glide pitch stabilization
        if (f.vel.y < -9.5) {
          f.vel.y = THREE.MathUtils.lerp(f.vel.y, -9.5, subDt * 1.5);
        }

        // Integrate Position
        f.pos.addScaledVector(f.vel, subDt);

        // Check Obstacle Collisions (Trees / Skyscrapers)
        for (const obs of hole.obstacles) {
          const distObs = Math.hypot(f.pos.x - obs.x, f.pos.z - obs.z);
          if (distObs < obs.radius + 0.55 && f.pos.y < obs.height - 0.35) {
            const pushX = (f.pos.x - obs.x) / Math.max(0.1, distObs);
            const pushZ = (f.pos.z - obs.z) / Math.max(0.1, distObs);
            f.vel.x = pushX * 4.5;
            f.vel.z = pushZ * 4.5;
            f.vel.y = Math.min(f.vel.y, -2.5);
            f.pos.x = obs.x + pushX * (obs.radius + 0.75);
            f.pos.z = obs.z + pushZ * (obs.radius + 0.75);
            sound.playLand();
          }
        }

        // Check Ground / Green / Cup / Hazard Landing
        const surfaceInfo = getSurfaceInfoAt(f.pos.x, f.pos.z, hole);
        const distToPin = Math.hypot(f.pos.x - hole.pinPos.x, f.pos.z - hole.pinPos.z);

        // Forgiving magnetic cup capture when flying or landing gently near the bullseye ring
        const gentleCaptureRadius = speed < 19 ? hole.cupRadius * 1.28 : hole.cupRadius;
        if (distToPin <= gentleCaptureRadius && Math.abs(f.pos.y - hole.pinPos.y) <= 2.4) {
          pushTrailPoint(f.pos);
          handleHoleIn(player, hole);
          return;
        }

        // Out-of-bounds check
        const outOfBounds = Math.abs(f.pos.x - hole.pinPos.x * 0.5) > 155 || f.pos.z > 45 || f.pos.z < hole.pinPos.z - 95;
        if (outOfBounds) {
          handleHazardPenalty(player, 'Out of Bounds! +1 Penalty Stroke');
          return;
        }

        // Surface Touchdown
        if (f.pos.y <= surfaceInfo.height + 0.35) {
          sound.stopFlightWind();

          if (surfaceInfo.surface === 'water') {
            handleHazardPenalty(player, hole.biome.id === 'winter' ? 'Icy Creek Hazard! +1 Penalty Stroke' : 'Creek Water Hazard! +1 Penalty Stroke');
            return;
          }

          if (surfaceInfo.surface === 'cup' || distToPin <= gentleCaptureRadius) {
            handleHoleIn(player, hole);
            return;
          }

          // Valid landing on Fairway, Green, or Rooftop with soft air-cushion settle
          sound.playLand();
          f.pos.y = surfaceInfo.height + 1.15;
          player.lie.copy(f.pos);
          if (activePlaneMesh) {
            activePlaneMesh.position.copy(player.lie);
            activePlaneMesh.rotation.z = 0;
          }

          const remDist = Math.round(distToPin);
          state.phase = 'LANDED_WAIT';
          showBanner(
            surfaceInfo.surface === 'green'
              ? `On the Green! ${remDist}m to pin (Approach Ready)`
              : `Landed! ${remDist}m to pin`,
            1600
          );

          setTimeout(() => {
            advanceTurnAfterLanding();
          }, 1500);
          return;
        }
      }

      pushTrailPoint(f.pos);
      sound.updateFlightWind(f.vel.length());

      // Update Paper Plane Orientation (Pitch, Yaw, Bank/Roll into crosswind)
      if (activePlaneMesh) {
        activePlaneMesh.position.copy(f.pos);
        const horizSpeed = Math.hypot(f.vel.x, f.vel.z);
        const headingYaw = Math.atan2(-f.vel.x, -f.vel.z);
        const climbPitch = Math.atan2(f.vel.y, Math.max(0.1, horizSpeed));
        const crossWindRoll = THREE.MathUtils.clamp((f.vel.x - state.flight.prevSafeLie.x) * 0.015, -0.45, 0.45);
        activePlaneMesh.rotation.set(-climbPitch, headingYaw + Math.PI, crossWindRoll, 'YXZ');
      }
    }

    function handleHoleIn(player, hole) {
      sound.stopFlightWind();
      sound.playHoleIn();
      player.holedOut = true;
      player.scores[state.currentHoleIndex] = player.strokesThisHole;
      player.lie.copy(hole.pinPos).add(new THREE.Vector3(0, 0.5, 0));

      if (activePlaneMesh) {
        activePlaneMesh.position.copy(player.lie);
      }

      spawnConfettiBurst(hole.pinPos);
      state.phase = 'LANDED_WAIT';

      const term = getGolfTerm(player.strokesThisHole, hole.par);
      showBanner(`${player.name}: ${term} (${player.strokesThisHole})`, 2200);

      setTimeout(() => {
        advanceTurnAfterLanding();
      }, 2100);
    }

    function handleHazardPenalty(player, message) {
      sound.stopFlightWind();
      sound.playSplash();
      player.strokesThisHole += 1; // +1 penalty stroke
      player.lie.copy(state.flight.prevSafeLie);
      state.phase = 'LANDED_WAIT';
      showBanner(message, 2000);

      setTimeout(() => {
        advanceTurnAfterLanding();
      }, 1900);
    }

    function updateCamera(dt, elapsed) {
      if (state.phase === 'SETUP') {
        // Gentle scenic orbit over the default alpine landscape
        const angle = elapsed * 0.14;
        camera.position.set(Math.sin(angle) * 55, 34, Math.cos(angle) * 55 - 40);
        camera.lookAt(0, 12, -65);
        return;
      }

      const hole = state.holes[state.currentHoleIndex];
      const player = state.players[state.currentPlayerIndex];

      if (state.cameraSurvey.active) {
        // Orbit around midpoint of hole so player can inspect obstacles and green
        const mid = new THREE.Vector3().lerpVectors(player.lie, hole.pinPos, 0.5);
        const baseDist = Math.max(45, player.lie.distanceTo(hole.pinPos) * 0.72) * state.cameraSurvey.zoom;
        const yaw = state.aim.yaw + state.cameraSurvey.yawOffset;
        const pitch = state.cameraSurvey.pitchOffset;

        camTargetPos.set(
          mid.x + Math.sin(yaw) * Math.cos(pitch) * baseDist,
          mid.y + Math.sin(pitch) * baseDist + 10,
          mid.z + Math.cos(yaw) * Math.cos(pitch) * baseDist
        );
        camera.position.lerp(camTargetPos, Math.min(1, dt * 8));
        camera.lookAt(mid);
        return;
      }

      if (state.phase === 'AIMING') {
        // Closer, lower approach camera when in Precision Approach mode for crisp green visibility
        const isPrec = state.aim.precisionMode;
        const distBack = isPrec ? 6.2 : 9.5;
        const heightUp = isPrec ? 3.1 : 4.2;
        const lookAhead = isPrec ? 18 : 28;
        camTargetPos.set(
          player.lie.x + Math.sin(state.aim.yaw) * distBack,
          player.lie.y + heightUp,
          player.lie.z + Math.cos(state.aim.yaw) * distBack
        );
        camLookAtPos.set(
          player.lie.x - Math.sin(state.aim.yaw) * lookAhead,
          player.lie.y + (isPrec ? 0.4 : 1.5),
          player.lie.z - Math.cos(state.aim.yaw) * lookAhead
        );
        camera.position.lerp(camTargetPos, Math.min(1, dt * 7.5));
        camera.lookAt(camLookAtPos);
      } else if (state.phase === 'FLYING' || state.phase === 'LANDED_WAIT') {
        // Dynamic chase camera trailing the paper plane
        const velDir = state.flight.vel.clone();
        if (velDir.lengthSq() < 0.1) {
          velDir.set(-Math.sin(state.aim.yaw), 0, -Math.cos(state.aim.yaw));
        } else {
          velDir.y = 0;
          velDir.normalize();
        }
        camTargetPos.copy(state.flight.pos).addScaledVector(velDir, -10.5).add(new THREE.Vector3(0, 4.4, 0));
        camera.position.lerp(camTargetPos, Math.min(1, dt * 6.5));
        camera.lookAt(state.flight.pos.x + velDir.x * 8, state.flight.pos.y - 0.5, state.flight.pos.z + velDir.z * 8);
      }
    }

    function updateEnvironmentAnimations(dt, elapsed) {
      // Animate Wind Particles drifting in world wind direction
      const posArr = windParticleGeo.attributes.position.array;
      const wx = state.wind.vec.x * 2.4;
      const wz = state.wind.vec.z * 2.4;
      for (let i = 0; i < windParticlesCount; i++) {
        posArr[i * 3] += (wx + Math.sin(elapsed + i) * 0.4) * dt;
        posArr[i * 3 + 2] += (wz + Math.cos(elapsed + i) * 0.4) * dt;

        // Wrap particles around player camera area
        if (posArr[i * 3] - camera.position.x > 120) posArr[i * 3] -= 240;
        if (posArr[i * 3] - camera.position.x < -120) posArr[i * 3] += 240;
        if (posArr[i * 3 + 2] - camera.position.z > 140) posArr[i * 3 + 2] -= 280;
        if (posArr[i * 3 + 2] - camera.position.z < -140) posArr[i * 3 + 2] += 280;
      }
      windParticleGeo.attributes.position.needsUpdate = true;

      // Animate Waving Flag in Wind
      if (flagClothMesh) {
        flagClothMesh.rotation.y = -state.wind.angle + Math.PI * 0.5;
        const fPos = flagClothMesh.geometry.attributes.position;
        for (let i = 0; i < fPos.count; i++) {
          const x = fPos.getX(i);
          fPos.setZ(i, Math.sin(elapsed * 7 - x * 1.8) * 0.16 * (x / 3.4));
        }
        fPos.needsUpdate = true;
      }

      // Pulse Target Bullseye Ring & Sky-Beacon Halo
      if (targetRingMesh) {
        const s = 1 + Math.sin(elapsed * 4) * 0.08;
        targetRingMesh.scale.set(s, s, 1);
      }
      if (beaconRingMesh && currentHoleData) {
        beaconRingMesh.position.y = currentHoleData.pinPos.y + 22 + Math.sin(elapsed * 2.5) * 2.2;
        const bs = 1 + Math.sin(elapsed * 3) * 0.14;
        beaconRingMesh.scale.set(bs, bs, 1);
      }

      // Update Confetti Particles
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const c = confettiParticles[i];
        c.life -= dt;
        if (c.life <= 0) {
          confettiGroup.remove(c.mesh);
          c.mesh.geometry.dispose();
          c.mesh.material.dispose();
          confettiParticles.splice(i, 1);
          continue;
        }
        c.vel.y -= 14 * dt;
        c.mesh.position.addScaledVector(c.vel, dt);
        c.mesh.rotation.x += c.rotSpeed.x * dt;
        c.mesh.rotation.y += c.rotSpeed.y * dt;
        c.mesh.rotation.z += c.rotSpeed.z * dt;
      }
    }

    function renderMiniMap() {
      if (state.phase === 'SETUP' || !currentHoleData) return;
      const mmCanvas = document.getElementById('minimap-canvas');
      if (!mmCanvas) return;

      const rect = mmCanvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(100, Math.round(rect.width * dpr));
      const h = Math.max(120, Math.round(rect.height * dpr));
      if (mmCanvas.width !== w || mmCanvas.height !== h) {
        mmCanvas.width = w;
        mmCanvas.height = h;
      }

      const ctx = mmCanvas.getContext('2d');
      ctx.clearRect(0, 0, w, h);

      const hole = currentHoleData;
      const player = state.players[state.currentPlayerIndex];
      const activePos = state.phase === 'FLYING' ? state.flight.pos : player.lie;

      // Map bounds covering Tee, Pin, and surrounding course corridor
      const minX = Math.min(hole.teePos.x, hole.pinPos.x) - 55;
      const maxX = Math.max(hole.teePos.x, hole.pinPos.x) + 55;
      const minZ = hole.pinPos.z - 28;
      const maxZ = hole.teePos.z + 24;

      const spanX = Math.max(90, maxX - minX);
      const spanZ = Math.max(120, maxZ - minZ);
      const scale = Math.min((w - 20 * dpr) / spanX, (h - 28 * dpr) / spanZ);
      const offsetX = (w - spanX * scale) * 0.5;
      const offsetY = (h - spanZ * scale) * 0.5 + 6 * dpr;

      const toMapX = (wx) => offsetX + (wx - minX) * scale;
      const toMapY = (wz) => offsetY + (wz - minZ) * scale;

      // Subtle Radar Grid
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
      ctx.lineWidth = 1 * dpr;
      for (let gx = 1; gx < 4; gx++) {
        ctx.beginPath();
        ctx.moveTo((w / 4) * gx, 0);
        ctx.lineTo((w / 4) * gx, h);
        ctx.stroke();
      }
      for (let gy = 1; gy < 5; gy++) {
        ctx.beginPath();
        ctx.moveTo(0, (h / 5) * gy);
        ctx.lineTo(w, (h / 5) * gy);
        ctx.stroke();
      }

      // Fairway / Flight Corridor Line from Tee to Pin
      const teeMX = toMapX(hole.teePos.x);
      const teeMY = toMapY(hole.teePos.z);
      const pinMX = toMapX(hole.pinPos.x);
      const pinMY = toMapY(hole.pinPos.z);

      ctx.strokeStyle = hole.biome.id === 'autumn' ? 'rgba(245, 158, 11, 0.32)' : hole.biome.id === 'winter' ? 'rgba(226, 232, 240, 0.32)' : 'rgba(52, 211, 153, 0.35)';
      ctx.lineWidth = 14 * dpr;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(teeMX, teeMY);
      ctx.lineTo(pinMX, pinMY);
      ctx.stroke();

      // Winding Creek Line on Radar Mini-Map
      if (hole.creek) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.72)';
        ctx.lineWidth = Math.max(3 * dpr, hole.creek.width * scale * 0.7);
        ctx.beginPath();
        for (let sx = minX; sx <= maxX; sx += 8) {
          const sz = hole.creek.z + Math.sin(sx * hole.creek.freq) * hole.creek.amp;
          const mx = toMapX(sx);
          const my = toMapY(sz);
          if (sx === minX) ctx.moveTo(mx, my);
          else ctx.lineTo(mx, my);
        }
        ctx.stroke();
      }

      // Obstacles (Seasonal Trees & Boulders)
      hole.obstacles.forEach((obs) => {
        const ox = toMapX(obs.x);
        const oy = toMapY(obs.z);
        const or = Math.max(2.5 * dpr, obs.radius * scale);
        ctx.fillStyle = obs.kind === 'blossom'
          ? 'rgba(244, 114, 182, 0.65)'
          : obs.kind === 'autumn_tree'
            ? 'rgba(234, 88, 12, 0.65)'
            : obs.kind === 'boulder'
              ? 'rgba(148, 163, 184, 0.6)'
              : 'rgba(34, 197, 94, 0.55)';
        ctx.beginPath();
        ctx.arc(ox, oy, or, 0, Math.PI * 2);
        ctx.fill();
      });

      // Thermal Updrafts
      hole.thermals.forEach((th) => {
        const tx = toMapX(th.x);
        const ty = toMapY(th.z);
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.7)';
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath();
        ctx.arc(tx, ty, Math.max(4 * dpr, th.radius * scale), 0, Math.PI * 2);
        ctx.stroke();
      });

      // Green & Flag Pin
      const greenR = Math.max(6 * dpr, hole.greenRadius * scale);
      ctx.fillStyle = 'rgba(34, 197, 94, 0.42)';
      ctx.beginPath();
      ctx.arc(pinMX, pinMY, greenR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(pinMX, pinMY, 3.6 * dpr, 0, Math.PI * 2);
      ctx.fill();

      // Flag Pennant Icon on Mini-Map
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.moveTo(pinMX, pinMY - 10 * dpr);
      ctx.lineTo(pinMX + 7 * dpr, pinMY - 7 * dpr);
      ctx.lineTo(pinMX, pinMY - 4 * dpr);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.3 * dpr;
      ctx.beginPath();
      ctx.moveTo(pinMX, pinMY);
      ctx.lineTo(pinMX, pinMY - 11 * dpr);
      ctx.stroke();

      // Sightline from Active Player to Flag
      const plMX = toMapX(activePos.x);
      const plMY = toMapY(activePos.z);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.setLineDash([3 * dpr, 3 * dpr]);
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      ctx.moveTo(plMX, plMY);
      ctx.lineTo(pinMX, pinMY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Aim Direction Cone when Aiming
      if (state.phase === 'AIMING') {
        const aimLen = (16 + state.aim.power * 26) * dpr;
        const ax = plMX - Math.sin(state.aim.yaw) * aimLen;
        const ay = plMY - Math.cos(state.aim.yaw) * aimLen;
        ctx.strokeStyle = state.aim.precisionMode ? '#34d399' : '#38bdf8';
        ctx.lineWidth = 2.2 * dpr;
        ctx.beginPath();
        ctx.moveTo(plMX, plMY);
        ctx.lineTo(ax, ay);
        ctx.stroke();
      }

      // All Players' Lies (Multiplayer Visibility)
      for (let i = 0; i < state.playerCount; i++) {
        const p = state.players[i];
        const pos = (i === state.currentPlayerIndex && state.phase === 'FLYING') ? state.flight.pos : p.lie;
        const px = toMapX(pos.x);
        const py = toMapY(pos.z);
        ctx.fillStyle = PLANE_COLORS[p.colorIdx].hex;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath();
        ctx.arc(px, py, i === state.currentPlayerIndex ? 4.5 * dpr : 3.2 * dpr, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Radar Label
      ctx.fillStyle = 'rgba(226, 232, 240, 0.8)';
      ctx.font = `700 ${9 * dpr}px "Plus Jakarta Sans", sans-serif`;
      ctx.fillText('RADAR', 7 * dpr, 12 * dpr);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      const elapsed = clock.elapsedTime;

      updatePhysics(dt);
      updateCamera(dt, elapsed);
      updateEnvironmentAnimations(dt, elapsed);
      renderMiniMap();

      renderer.render(scene, camera);
    }

    // Handle Window / Orientation Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Build initial scenic backdrop on load
    window.onload = function () {
      const previewHoles = generateCourseHoles(1);
      buildHoleEnvironment(previewHoles[0]);
      animate();
    };
  </script>
</body>
</html>
