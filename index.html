    // =========================================================================
    // 12. COURSE RADAR MINI-MAP RENDERER
    // =========================================================================
    const minimapCanvas = document.getElementById('minimap-canvas');
    const mmCtx = minimapCanvas.getContext('2d');

    function renderMiniMap() {
      if (!mmCtx || state.phase === 'MENU' || state.holes.length === 0) return;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = minimapCanvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      if (minimapCanvas.width !== Math.round(rect.width * dpr) || minimapCanvas.height !== Math.round(rect.height * dpr)) {
        minimapCanvas.width = Math.round(rect.width * dpr);
        minimapCanvas.height = Math.round(rect.height * dpr);
      }

      const w = minimapCanvas.width;
      const h = minimapCanvas.height;
      mmCtx.clearRect(0, 0, w, h);

      const hole = state.holes[state.currentHoleIdx];
      const activePlayer = state.players[state.activePlayerIdx];
      const curPos = state.phase === 'FLYING' ? state.flight.pos : activePlayer.lie;

      const minX = Math.min(-45, hole.pinPos.x - 32, curPos.x - 24);
      const maxX = Math.max(45, hole.pinPos.x + 32, curPos.x + 24);
      const maxZ = Math.max(18, curPos.z + 18);
      const minZ = Math.min(hole.pinPos.z - 22, curPos.z - 22);

      const pad = 12 * dpr;
      const spanX = Math.max(60, maxX - minX);
      const spanZ = Math.max(80, maxZ - minZ);
      const scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanZ);
      const offsetX = (w - spanX * scale) * 0.5;
      const offsetY = (h - spanZ * scale) * 0.5;

      const toMap = (wx, wz) => ({
        x: offsetX + (wx - minX) * scale,
        y: offsetY + (wz - minZ) * scale
      });

      mmCtx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      mmCtx.lineWidth = 1 * dpr;
      for (let gx = -60; gx <= 60; gx += 30) {
        const p1 = toMap(gx, minZ);
        const p2 = toMap(gx, maxZ);
        mmCtx.beginPath();
        mmCtx.moveTo(p1.x, p1.y);
        mmCtx.lineTo(p2.x, p2.y);
        mmCtx.stroke();
      }

      if (hole.creek) {
        mmCtx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
        mmCtx.lineWidth = Math.max(2 * dpr, hole.creek.halfWidth * 1.4 * scale);
        mmCtx.beginPath();
        for (let wx = minX; wx <= maxX; wx += 4) {
          const wz = hole.creek.zBase + Math.sin(wx * hole.creek.freq + hole.creek.phase) * hole.creek.amp;
          const pt = toMap(wx, wz);
          if (wx === minX) mmCtx.moveTo(pt.x, pt.y);
          else mmCtx.lineTo(pt.x, pt.y);
        }
        mmCtx.stroke();
      }

      for (const wz of hole.waterZones) {
        const p = toMap(wz.x, wz.z);
        mmCtx.fillStyle = 'rgba(56, 189, 248, 0.45)';
        mmCtx.beginPath();
        mmCtx.ellipse(p.x, p.y, wz.rx * scale, wz.rz * scale, 0, 0, Math.PI * 2);
        mmCtx.fill();
      }

      const teeM = toMap(hole.teePos.x, hole.teePos.z);
      const pinM = toMap(hole.pinPos.x, hole.pinPos.z);
      mmCtx.strokeStyle = 'rgba(74, 222, 128, 0.28)';
      mmCtx.lineWidth = Math.max(6 * dpr, 16 * scale);
      mmCtx.lineCap = 'round';
      mmCtx.beginPath();
      mmCtx.moveTo(teeM.x, teeM.y);
      mmCtx.lineTo(pinM.x, pinM.y);
      mmCtx.stroke();

      for (const obs of hole.obstacles) {
        const p = toMap(obs.x, obs.z);
        mmCtx.fillStyle = obs.type === 'boulder' ? 'rgba(148, 163, 184, 0.7)' : 'rgba(34, 197, 94, 0.7)';
        mmCtx.beginPath();
        mmCtx.arc(p.x, p.y, Math.max(1.8 * dpr, obs.radius * scale), 0, Math.PI * 2);
        mmCtx.fill();
      }

      for (const th of hole.thermals) {
        const p = toMap(th.x, th.z);
        mmCtx.strokeStyle = 'rgba(125, 211, 252, 0.75)';
        mmCtx.lineWidth = 1.4 * dpr;
        mmCtx.beginPath();
        mmCtx.arc(p.x, p.y, Math.max(3 * dpr, th.radius * scale), 0, Math.PI * 2);
        mmCtx.stroke();
      }

      mmCtx.fillStyle = 'rgba(74, 222, 128, 0.45)';
      mmCtx.beginPath();
      mmCtx.arc(pinM.x, pinM.y, Math.max(4.5 * dpr, hole.greenRadius * scale), 0, Math.PI * 2);
      mmCtx.fill();

      mmCtx.fillStyle = '#fbbf24';
      mmCtx.beginPath();
      mmCtx.arc(pinM.x, pinM.y, 2.6 * dpr, 0, Math.PI * 2);
      mmCtx.fill();
      mmCtx.strokeStyle = '#ffffff';
      mmCtx.lineWidth = 1.4 * dpr;
      mmCtx.beginPath();
      mmCtx.moveTo(pinM.x, pinM.y);
      mmCtx.lineTo(pinM.x, pinM.y - 8 * dpr);
      mmCtx.stroke();
      mmCtx.fillStyle = '#ef4444';
      mmCtx.beginPath();
      mmCtx.moveTo(pinM.x, pinM.y - 8 * dpr);
      mmCtx.lineTo(pinM.x + 5.5 * dpr, pinM.y - 6 * dpr);
      mmCtx.lineTo(pinM.x, pinM.y - 4 * dpr);
      mmCtx.fill();

      const meM = toMap(curPos.x, curPos.z);
      if (state.phase === 'AIMING') {
        const aimLen = (state.aim.precisionMode ? 24 : 52) * scale;
        const ax = meM.x - Math.sin(state.aim.yaw) * aimLen;
        const ay = meM.y - Math.cos(state.aim.yaw) * aimLen;
        mmCtx.strokeStyle = state.aim.precisionMode ? '#34d399' : '#38bdf8';
        mmCtx.lineWidth = 1.6 * dpr;
        mmCtx.setLineDash([3 * dpr, 2 * dpr]);
        mmCtx.beginPath();
        mmCtx.moveTo(meM.x, meM.y);
        mmCtx.lineTo(ax, ay);
        mmCtx.stroke();
        mmCtx.setLineDash([]);
      }

      mmCtx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      mmCtx.lineWidth = 1 * dpr;
      mmCtx.setLineDash([2 * dpr, 2 * dpr]);
      mmCtx.beginPath();
      mmCtx.moveTo(meM.x, meM.y);
      mmCtx.lineTo(pinM.x, pinM.y);
      mmCtx.stroke();
      mmCtx.setLineDash([]);

      for (let i = 0; i < state.playerCount; i++) {
        if (i === state.activePlayerIdx || state.players[i].holed) continue;
        const op = toMap(state.players[i].lie.x, state.players[i].lie.z);
        mmCtx.fillStyle = PAPER_COLORS[state.players[i].colorIdx].hex;
        mmCtx.beginPath();
        mmCtx.arc(op.x, op.y, 2.5 * dpr, 0, Math.PI * 2);
        mmCtx.fill();
      }

      const myCol = PAPER_COLORS[activePlayer.colorIdx].hex;
      mmCtx.fillStyle = myCol;
      mmCtx.beginPath();
      mmCtx.arc(meM.x, meM.y, 3.6 * dpr, 0, Math.PI * 2);
      mmCtx.fill();
      mmCtx.strokeStyle = '#0f172a';
      mmCtx.lineWidth = 1.4 * dpr;
      mmCtx.stroke();
    }

    // =========================================================================
    // 13. FLIGHT COLLISION & LANDING RESOLUTION
    // =========================================================================
    function formatGolfScoreLabel(strokes, par) {
      const diff = strokes - par;
      if (strokes === 1) return 'HOLE-IN-ONE!';
      if (diff <= -3) return 'ALBATROSS!';
      if (diff === -2) return 'EAGLE!';
      if (diff === -1) return 'BIRDIE!';
      if (diff === 0) return 'PAR';
      if (diff === 1) return 'BOGEY';
      if (diff === 2) return 'DOUBLE BOGEY';
      return `+${diff}`;
    }

    function onPlaneLanded(reason, landPos) {
      const hole = state.holes[state.currentHoleIdx];
      const player = state.players[state.activePlayerIdx];
      state.phase = 'LANDED_WAIT';

      const distToPin = Math.hypot(landPos.x - hole.pinPos.x, landPos.z - hole.pinPos.z);
      const gimmeRadius = 3.8;

      if (reason === 'WATER') {
        sound.playLanding(true);
        player.strokes++;
        player.lie.copy(state.flight.lastSafeLie);
        activePlaneMesh.position.copy(player.lie);
        showBanner('Splash! Water Hazard (+1 Penalty Stroke)', 2300);
        setTimeout(advanceTurnOrHole, 1850);
        return;
      }

      if (reason === 'OUT_OF_BOUNDS') {
        sound.playLanding(true);
        player.strokes++;
        player.lie.copy(state.flight.lastSafeLie);
        activePlaneMesh.position.copy(player.lie);
        showBanner('Out of Bounds! (+1 Penalty Stroke)', 2300);
        setTimeout(advanceTurnOrHole, 1850);
        return;
      }

      if (distToPin <= hole.holeRadius) {
        sound.playHoleChime();
        player.holed = true;
        player.scores[state.currentHoleIdx] = player.strokes;
        player.lie.set(hole.pinPos.x, hole.pinPos.y + 0.15, hole.pinPos.z);
        activePlaneMesh.position.copy(player.lie);
        const label = formatGolfScoreLabel(player.strokes, hole.par);
        showBanner(`${player.name}: ${label} (${player.strokes})`, 2600);
        setTimeout(advanceTurnOrHole, 2100);
        return;
      }

      if (distToPin <= gimmeRadius) {
        sound.playHoleChime();
        player.strokes++;
        player.holed = true;
        player.scores[state.currentHoleIdx] = player.strokes;
        player.lie.set(hole.pinPos.x, hole.pinPos.y + 0.15, hole.pinPos.z);
        activePlaneMesh.position.copy(player.lie);
        const label = formatGolfScoreLabel(player.strokes, hole.par);
        showBanner(`${player.name}: Tap-In Gimme! ${label} (${player.strokes})`, 2600);
        setTimeout(advanceTurnOrHole, 2100);
        return;
      }

      sound.playLanding(false);
      const surf = getSurfaceInfoAt(landPos.x, landPos.z, hole);
      player.lie.set(landPos.x, surf.height + 0.85, landPos.z);
      activePlaneMesh.position.copy(player.lie);
      activePlaneMesh.rotation.set(0.08, state.aim.yaw, 0);

      if (player.strokes >= hole.par + 5) {
        player.holed = true;
        player.scores[state.currentHoleIdx] = player.strokes;
        showBanner(`${player.name} reached max strokes (${player.strokes})`, 2200);
      } else {
        const zoneMsg = distToPin <= hole.greenRadius ? 'On the Green!' : `${Math.round(distToPin)}m from Pin`;
        showBanner(`${player.name} landed — ${zoneMsg}`, 1800);
      }

      setTimeout(advanceTurnOrHole, 1550);
    }

    function advanceTurnOrHole() {
      const hole = state.holes[state.currentHoleIdx];
      let nextIdx = -1;
      let maxDist = -1;

      for (let i = 0; i < state.playerCount; i++) {
        const p = state.players[i];
        if (!p.holed) {
          const d = Math.hypot(p.lie.x - hole.pinPos.x, p.lie.z - hole.pinPos.z);
          if (d > maxDist) {
            maxDist = d;
            nextIdx = i;
          }
        }
      }

      if (nextIdx !== -1) {
        preparePlayerTurn(nextIdx);
      } else {
        state.phase = 'HOLE_SUMMARY';
        openScorecardModal('HOLE_END');
      }
    }

    // =========================================================================
    // 14. MAIN 3D ANIMATION & PHYSICS LOOP
    // =========================================================================
    let lastTime = performance.now();
    const camTargetPos = new THREE.Vector3();
    const camLookAtPos = new THREE.Vector3();

    function updateEnvironmentAnimations(elapsed) {
      if (flagClothMesh) {
        const pos = flagClothMesh.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          pos.setZ(i, Math.sin(elapsed * 5.2 + x * 2.4) * 0.16 * (x / 2.6));
        }
        pos.needsUpdate = true;
        flagClothMesh.rotation.y = -state.wind.angle + Math.PI * 0.5;
      }

      if (beaconRingMesh) {
        const pulse = 1 + Math.sin(elapsed * 3.2) * 0.16;
        beaconRingMesh.scale.set(pulse, pulse, 1);
        beaconRingMesh.material.opacity = 0.42 + Math.sin(elapsed * 3.2) * 0.18;
      }

      for (const tr of thermalRings) {
        const cycle = (elapsed * 4.5 + tr.offset) % 27;
        tr.mesh.position.y = tr.baseY + cycle;
        tr.mesh.material.opacity = Math.sin((cycle / 27) * Math.PI) * 0.45;
      }

      const wp = windParticleGeo.attributes.position;
      const wx = state.wind.vec.x * 1.8;
      const wz = state.wind.vec.z * 1.8;
      for (let i = 0; i < WIND_PARTICLE_COUNT; i++) {
        let px = wp.getX(i) + wx * 0.016;
        let pz = wp.getZ(i) + wz * 0.016;
        if (px > 95) px = -95;
        if (px < -95) px = 95;
        if (pz > 35) pz = -265;
        if (pz < -265) pz = 35;
        wp.setX(i, px);
        wp.setZ(i, pz);
      }
      wp.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const elapsed = now * 0.001;

      updateEnvironmentAnimations(elapsed);

      if (state.phase === 'MENU') {
        const angle = elapsed * 0.16;
        camera.position.set(Math.sin(angle) * 65, 34, -65 + Math.cos(angle) * 75);
        camera.lookAt(0, 8, -75);
        renderer.render(scene, camera);
        return;
      }

      const hole = state.holes[state.currentHoleIdx];
      const player = state.players[state.activePlayerIdx];

      if (state.phase === 'FLYING') {
        state.flight.time += dt;
        const subSteps = 3;
        const subDt = dt / subSteps;
        let terminated = false;

        for (let s = 0; s < subSteps; s++) {
          stepAerodynamics(state.flight.pos, state.flight.vel, player, hole, subDt);

          if (Math.abs(state.flight.pos.x) > 132 || state.flight.pos.z > 28 || state.flight.pos.z < -305) {
            onPlaneLanded('OUT_OF_BOUNDS', state.flight.pos);
            terminated = true;
            break;
          }

          let hitObs = false;
          for (const obs of hole.obstacles) {
            const dObs = Math.hypot(state.flight.pos.x - obs.x, state.flight.pos.z - obs.z);
            if (dObs < obs.radius + 0.45 && state.flight.pos.y < obs.baseY + obs.height) {
              state.flight.vel.multiplyScalar(-0.22);
              state.flight.vel.y = Math.min(state.flight.vel.y, -1.5);
              hitObs = true;
              break;
            }
          }

          const surf = getSurfaceInfoAt(state.flight.pos.x, state.flight.pos.z, hole);
          if (state.flight.pos.y <= surf.height + 0.25) {
            if (surf.surface === 'water') {
              onPlaneLanded('WATER', state.flight.pos);
              terminated = true;
              break;
            }

            const distToPin = Math.hypot(state.flight.pos.x - hole.pinPos.x, state.flight.pos.z - hole.pinPos.z);
            if (distToPin <= hole.holeRadius && state.flight.vel.length() < 26) {
              onPlaneLanded('GROUND', state.flight.pos);
              terminated = true;
              break;
            }

            const horizSpeed = Math.hypot(state.flight.vel.x, state.flight.vel.z);
            if (horizSpeed > 4.2 && !hitObs && state.flight.time < 12) {
              state.flight.pos.y = surf.height + 0.26;
              state.flight.vel.x *= 0.42;
              state.flight.vel.z *= 0.42;
              state.flight.vel.y = Math.abs(state.flight.vel.y) * 0.16;
            } else {
              onPlaneLanded('GROUND', state.flight.pos);
              terminated = true;
              break;
            }
          }
        }

        if (!terminated) {
          activePlaneMesh.position.copy(state.flight.pos);
          const heading = Math.atan2(-state.flight.vel.x, -state.flight.vel.z);
          const horizSpd = Math.hypot(state.flight.vel.x, state.flight.vel.z);
          const pitch = Math.atan2(state.flight.vel.y, Math.max(0.1, horizSpd));
          const bank = THREE.MathUtils.clamp(-state.wind.vec.x * 0.035 + Math.sin(elapsed * 3.5) * 0.06, -0.42, 0.42);
          activePlaneMesh.rotation.set(pitch, heading, bank);

          pushTrailPoint(state.flight.pos);
          sound.updateFlightWind(Math.min(1, state.flight.vel.length() / 42));

          const distNow = Math.hypot(state.flight.pos.x - hole.pinPos.x, state.flight.pos.z - hole.pinPos.z);
          document.getElementById('hud-dist').textContent = `${Math.round(distNow)}m`;
        }
      }

      if (state.surveyMode && state.phase === 'AIMING') {
        const sc = state.surveyCam;
        camTargetPos.set(
          sc.target.x + Math.sin(sc.yaw) * Math.cos(sc.pitch) * sc.dist,
          sc.target.y + Math.sin(sc.pitch) * sc.dist,
          sc.target.z + Math.cos(sc.yaw) * Math.cos(sc.pitch) * sc.dist
        );
        camera.position.lerp(camTargetPos, Math.min(1, dt * 8));
        camera.lookAt(sc.target);
      } else if (state.phase === 'AIMING') {
        const isPrec = state.aim.precisionMode;
        const distBack = isPrec ? 8.2 : 11.4;
        const heightUp = isPrec ? 4.3 : 5.4;
        const lookAhead = isPrec ? 18 : 28;
        camTargetPos.set(
          player.lie.x + Math.sin(state.aim.yaw) * distBack,
          player.lie.y + heightUp,
          player.lie.z + Math.cos(state.aim.yaw) * distBack
        );
        camLookAtPos.set(
          player.lie.x - Math.sin(state.aim.yaw) * lookAhead,
          player.lie.y - (isPrec ? 0.35 : 0.1),
          player.lie.z - Math.cos(state.aim.yaw) * lookAhead
        );
        camera.position.lerp(camTargetPos, Math.min(1, dt * 7.5));
        camera.lookAt(camLookAtPos);

        if (activePlaneMesh && !state.aim.isDragging) {
          activePlaneMesh.position.y = player.lie.y + Math.sin(elapsed * 2.8) * 0.12;
        }
      } else if (state.phase === 'FLYING' || state.phase === 'LANDED_WAIT') {
        const planePos = activePlaneMesh ? activePlaneMesh.position : player.lie;
        const velDir = state.flight.vel.lengthSq() > 0.5
          ? state.flight.vel.clone().setY(0).normalize()
          : new THREE.Vector3(-Math.sin(state.aim.yaw), 0, -Math.cos(state.aim.yaw));

        camTargetPos.set(
          planePos.x - velDir.x * 11.5,
          planePos.y + 4.4,
          planePos.z - velDir.z * 11.5
        );
        camLookAtPos.set(
          planePos.x + velDir.x * 14,
          planePos.y - 0.8,
          planePos.z + velDir.z * 14
        );
        camera.position.lerp(camTargetPos, Math.min(1, dt * 6.5));
        camera.lookAt(camLookAtPos);
      }

      renderMiniMap();
      renderer.render(scene, camera);
    }

    function handleViewportResize() {
      const w = document.documentElement.clientWidth || window.innerWidth;
      const h = Math.max(
        window.innerHeight,
        document.documentElement.clientHeight || 0,
        window.visualViewport ? Math.round(window.visualViewport.height) : 0
      );
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    window.addEventListener('resize', handleViewportResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleViewportResize);
    }

    window.onload = function () {
      handleViewportResize();
      const previewHoles = generateCourseHoles(1);
      buildHoleEnvironment(previewHoles[0]);
      animate();
    };
  </script>
</body>
