<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AERO FOLD" />
  <meta name="theme-color" content="#0f172a" />
  <title>AERO FOLD — Paperplane Golf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --glass-bg: rgba(15, 23, 42, 0.62);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-light: rgba(255, 255, 255, 0.88);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.45);
      --gold: #fbbf24;
      --emerald: #34d399;
      --rose: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      touch-action: none;
    }

    h1, h2, h3, .font-display {
      font-family: 'Outfit', sans-serif;
    }

    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Frosted Glass Utility */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    .glass-pill {
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.35rem;
      border-radius: 1rem;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s, box-shadow 0.2s;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      border-color: rgba(125, 211, 252, 0.45);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.38);
    }

    .btn-primary:hover {
      box-shadow: 0 10px 28px rgba(14, 165, 233, 0.55);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: rgba(110, 231, 183, 0.45);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 9999px;
    }

    /* Screens Overlay */
    .screen-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(1rem + var(--safe-top)) calc(1rem + var(--safe-right)) calc(1rem + var(--safe-bottom)) calc(1rem + var(--safe-left));
      background: radial-gradient(circle at 50% 25%, rgba(15, 23, 42, 0.32), rgba(15, 23, 42, 0.78));
      transition: opacity 0.35s ease, visibility 0.35s ease;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .screen-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Setup Card */
    .setup-card {
      width: 100%;
      max-width: 780px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 1.75rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      touch-action: pan-y;
    }

    @media (min-width: 640px) {
      .setup-card {
        padding: 2rem;
      }
    }

    /* Segmented Controls */
    .seg-group {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      background: rgba(15, 23, 42, 0.65);
      padding: 0.3rem;
      border-radius: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      gap: 0.25rem;
    }

    .seg-btn {
      padding: 0.6rem 0.5rem;
      border-radius: 0.7rem;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .seg-btn.active {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      color: #fff;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
    }

    /* Player Config Rows */
    .player-card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .player-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .name-input {
      flex: 1;
      min-width: 140px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 0.75rem;
      padding: 0.55rem 0.85rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .name-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .color-swatches {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .swatch.active {
      transform: scale(1.18);
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.6);
    }

    /* Plane Model Selector Grid */
    .plane-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.55rem;
    }

    @media (min-width: 640px) {
      .plane-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .plane-option {
      background: rgba(15, 23, 42, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.9rem;
      padding: 0.6rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .plane-option.active {
      background: rgba(14, 165, 233, 0.22);
      border-color: #38bdf8;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
    }

    .stat-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 99px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: #38bdf8;
    }

    /* HUD Layer */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(0.65rem + var(--safe-top)) calc(0.75rem + var(--safe-right)) calc(0.75rem + var(--safe-bottom)) calc(0.75rem + var(--safe-left));
    }

    #hud.hidden {
      display: none;
    }

    .hud-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      pointer-events: auto;
    }

    .hole-badge {
      padding: 0.5rem 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .wind-pill {
      padding: 0.45rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    #wind-arrow-wrap {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Center Status Toast / Banner */
    #status-banner {
      position: fixed;
      top: calc(4.5rem + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 15;
      padding: 0.65rem 1.35rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      text-align: center;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #status-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom HUD & Slingshot Controls */
    .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
    }

    .launch-telemetry {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.55rem 1.15rem;
      pointer-events: auto;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .launch-telemetry.hidden-panel {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    .pitch-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="range"].pitch-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 105px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      outline: none;
    }

    input[type="range"].pitch-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .player-turn-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      padding: 0.55rem 1.1rem;
      width: 100%;
      max-width: 520px;
      pointer-events: auto;
    }

    /* Slingshot Touch/Mouse Overlay Ring */
    #slingshot-indicator {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9;
    }

    /* Modals (Scorecard & Hole Summary) */
    .modal-card {
      width: 100%;
      max-width: 680px;
      max-height: 86vh;
      overflow-y: auto;
      border-radius: 1.5rem;
      padding: 1.5rem;
      touch-action: pan-y;
    }

    table.score-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: center;
    }

    table.score-table th, table.score-table td {
      padding: 0.55rem 0.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    table.score-table th {
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .score-under { color: #34d399; font-weight: 800; }
    .score-over { color: #fb7185; font-weight: 700; }
    .score-even { color: #e2e8f0; font-weight: 700; }

    /* Helper classes */
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-3xl { font-size: 1.875rem; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-muted { color: #94a3b8; }
    .text-sky { color: #38bdf8; }
    .text-gold { color: #fbbf24; }
    .text-emerald { color: #34d399; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }

    /* Survey Mode Active Ring */
    .survey-active {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      border-color: #fde68a !important;
    }

    /* Precision Mode Pill & Active State */
    .precision-pill {
      padding: 0.42rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 23, 42, 0.62);
    }

    .precision-pill.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border-color: #6ee7b3;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.42);
    }

    /* Course Radar Mini-Map */
    .minimap-wrap {
      position: fixed;
      top: calc(4.75rem + var(--safe-top));
      right: calc(0.75rem + var(--safe-right));
      width: 112px;
      height: 142px;
      border-radius: 1rem;
      overflow: hidden;
      pointer-events: auto;
      z-index: 12;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .minimap-wrap {
        width: 136px;
        height: 172px;
      }
    }

    #minimap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Three.js WebGL Viewport -->
  <canvas id="game-canvas"></canvas>

  <!-- 2D SVG Forward Swipe Throw Indicator Overlay -->
  <svg id="slingshot-indicator" width="100%" height="100%">
    <defs>
      <linearGradient id="swipeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#34d399" stop-opacity="0.95" />
      </linearGradient>
    </defs>
    <g id="sling-group" style="display: none;">
      <circle id="sling-anchor" cx="0" cy="0" r="18" fill="rgba(56, 189, 248, 0.16)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
      <line id="sling-line" x1="0" y1="0" x2="0" y2="0" stroke="url(#swipeGrad)" stroke-width="5" stroke-linecap="round" />
      <circle id="sling-knob" cx="0" cy="0" r="13" fill="#34d399" stroke="#ffffff" stroke-width="3" />
    </g>
  </svg>

  <!-- Floating Status Notification Banner -->
  <div id="status-banner" class="glass">Ready to Swipe</div>

  <!-- IN-GAME HUD -->
  <div id="hud" class="hidden">
    <!-- Top Bar -->
    <div class="hud-top">
      <div class="hud-group">
        <div class="glass-pill hole-badge">
          <div>
            <div class="text-xs text-muted font-bold" id="hud-biome-name">ALPINE PEAKS</div>
            <div class="font-display font-extrabold text-base">
              HOLE <span id="hud-hole-num" class="text-sky">1</span><span class="text-muted text-sm">/<span id="hud-hole-total">9</span></span>
              <span style="margin: 0 6px; opacity: 0.3;">•</span>
              PAR <span id="hud-par" class="text-gold">3</span>
            </div>
          </div>
          <div style="border-left: 1px solid rgba(255,255,255,0.15); padding-left: 0.75rem;">
            <div class="text-xs text-muted font-bold">PIN DIST</div>
            <div class="font-display font-extrabold text-base"><span id="hud-dist">120</span><span class="text-xs text-muted">m</span></div>
          </div>
        </div>
      </div>

      <div class="hud-group">
        <!-- Wind Compass Pill -->
        <div class="glass-pill wind-pill" title="Wind Speed & Direction">
          <div id="wind-arrow-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </div>
          <div>
            <div class="text-xs text-muted font-bold" style="line-height: 1;">WIND</div>
            <div class="font-display font-extrabold text-sm"><span id="hud-wind-speed">6</span> <span class="text-xs text-muted">kts</span></div>
          </div>
        </div>

        <!-- Survey / Free Look Toggle -->
        <button id="btn-survey" class="btn btn-icon glass-pill" title="Survey Course Camera" aria-label="Survey Course">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>

        <!-- Scorecard Button -->
        <button id="btn-scorecard" class="btn btn-icon glass-pill" title="Scorecard" aria-label="Scorecard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="9" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>

        <!-- Mute/Unmute Button -->
        <button id="btn-audio" class="btn btn-icon glass-pill" title="Toggle Sound" aria-label="Toggle Sound">
          <svg id="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="icon-sound-off" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Course Radar Mini-Map -->
    <div id="minimap-container" class="glass minimap-wrap" title="Course Radar — Tap to toggle Survey View">
      <canvas id="minimap-canvas"></canvas>
    </div>

    <!-- Bottom Controls -->
    <div class="hud-bottom">
      <!-- Launch Pitch & Power Telemetry Bar -->
      <div id="launch-telemetry" class="glass-pill launch-telemetry" style="flex-wrap: wrap; justify-content: center;">
        <button type="button" id="btn-precision" class="precision-pill" title="Toggle Precision Approach Mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="4"></circle>
          </svg>
          <span id="precision-label">APPROACH: AUTO</span>
        </button>
        <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.16);"></div>
        <div class="pitch-control">
          <span class="text-xs font-bold text-muted">PITCH</span>
          <input type="range" id="pitch-slider" class="pitch-slider" min="2" max="42" value="16" />
          <span id="hud-pitch-val" class="font-display font-bold text-sm text-sky" style="min-width: 32px;">16°</span>
        </div>
        <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.16);"></div>
        <div>
          <span class="text-xs font-bold text-muted">POWER </span>
          <span id="hud-power-val" class="font-display font-extrabold text-sm text-emerald">0%</span>
        </div>
      </div>

      <!-- Active Player Bar -->
      <div class="glass-pill player-turn-bar">
        <div class="flex-center gap-2">
          <span id="hud-player-dot" style="width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.6);"></span>
          <div>
            <div class="font-display font-extrabold text-sm" id="hud-player-name">Player 1</div>
            <div class="text-xs text-muted" id="hud-plane-model">The Swallow</div>
          </div>
        </div>

  <script>
    /**

    // =========================================================================

    // =========================================================================
    // 3. PROCEDURAL WEB AUDIO SYNTHESIZER (Zero External Sound Files)
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.windNode = null;
        this.windGain = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.windGain && this.ctx) {
          this.windGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
        }
        return this.muted;
      }

      playClick(pitch = 620) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 1.4, now + 0.06);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.075);
      }

      playWhoosh(powerRatio = 0.7) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.65;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(240 + powerRatio * 200, now);
        filter.frequency.exponentialRampToValueAtTime(750 + powerRatio * 600, now + 0.25);
        filter.frequency.exponentialRampToValueAtTime(220, now + 0.65);
        filter.Q.value = 1.8;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.28 * (0.4 + powerRatio * 0.6), now + 0.16);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      startFlightWind() {
        if (this.muted) return;
        this.init();
        if (!this.ctx || this.windNode) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 340;

        const gain = this.ctx.createGain();
        gain.gain.value = 0.001;

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();

        this.windNode = noise;
        this.windFilter = filter;
        this.windGain = gain;
      }

      updateFlightWind(speed) {
        if (!this.windGain || !this.ctx || this.muted) return;
        const clamped = Math.min(1, Math.max(0, speed / 42));
        this.windGain.gain.setTargetAtTime(clamped * 0.11, this.ctx.currentTime, 0.08);
        if (this.windFilter) {
          this.windFilter.frequency.setTargetAtTime(220 + clamped * 520, this.ctx.currentTime, 0.08);
        }
      }

      stopFlightWind() {
        if (this.windNode) {
          try {
            this.windNode.stop();
            this.windNode.disconnect();
          } catch (e) {}
          this.windNode = null;
          this.windGain = null;
          this.windFilter = null;
        }
      }

      playLand() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.14);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }

      playSplash() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.5;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.14));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(180, now + 0.45);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      playHoleIn() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.09;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.58);
        });
      }
    }

    const sound = new SoundEngine();

    // =========================================================================
    // 4. PROCEDURAL 3D PAPER PLANE BUILDER
    // =========================================================================
    function createPaperPlaneMesh(modelId, colorHex, creaseHex) {
      const group = new THREE.Group();

      const mainMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(colorHex),
        roughness: 0.62,
        metalness: 0.04,
        side: THREE.DoubleSide,
        flatShading: true
      });

      const keelMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(creaseHex),
        roughness: 0.72,
        metalness: 0.04,
        side: THREE.DoubleSide,
        flatShading: true
      });

      // Helper to build custom folded triangle geometry
      function makeWingGeo(vertices) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.computeVertexNormals();
        return geo;
      }

      let wingsVerts = [];
      let keelVerts = [];

      if (modelId === 'dart') {
        // Sleek narrow high-speed dart (+Z is forward nose)
        wingsVerts = [
          // Left main wing
          0, 0.05, 1.45,
          -0.72, 0.14, -1.05,
          -0.12, 0.06, -1.05,
          // Right main wing
          0, 0.05, 1.45,
          0.12, 0.06, -1.05,
          0.72, 0.14, -1.05,
          // Left winglet
          -0.72, 0.14, -1.05,
          -0.78, 0.34, -1.05,
          -0.35, 0.09, 0.25,
          // Right winglet
          0.72, 0.14, -1.05,
          0.35, 0.09, 0.25,
          0.78, 0.34, -1.05
        ];
        keelVerts = [
          // Left center fold
          0, 0.05, 1.45,
          -0.12, 0.06, -1.05,
          0, -0.28, -1.05,
          // Right center fold
          0, 0.05, 1.45,
          0, -0.28, -1.05,
          0.12, 0.06, -1.05
        ];
      } else if (modelId === 'glider') {
        // Wide soaring wingspan
        wingsVerts = [
          // Left wing
          0, 0.04, 1.05,
          -1.45, 0.22, -0.65,
          -0.14, 0.05, -0.85,
          // Right wing
          0, 0.04, 1.05,
          0.14, 0.05, -0.85,
          1.45, 0.22, -0.65,
          // Left upturned wingtip
          -1.45, 0.22, -0.65,
          -1.62, 0.48, -0.75,
          -0.85, 0.14, 0.15,
          // Right upturned wingtip
          1.45, 0.22, -0.65,
          0.85, 0.14, 0.15,
          1.62, 0.48, -0.75
        ];
        keelVerts = [
          0, 0.04, 1.05,
          -0.14, 0.05, -0.85,
          0, -0.24, -0.85,

          0, 0.04, 1.05,
          0, -0.24, -0.85,
          0.14, 0.05, -0.85
        ];
      } else if (modelId === 'nakamura') {
        // Heavy folded nose (Nakamura lock triangle) + sturdy delta wings
        wingsVerts = [
          // Left wing
          0, 0.05, 1.15,
          -1.08, 0.12, -0.95,
          -0.14, 0.05, -0.95,
          // Right wing
          0, 0.05, 1.15,
          0.14, 0.05, -0.95,
          1.08, 0.12, -0.95,
          // Nose lock flap left
          0, 0.07, 0.72,
          -0.46, 0.09, 0.15,
          0, 0.07, 0.10,
          // Nose lock flap right
          0, 0.07, 0.72,
          0, 0.07, 0.10,
          0.46, 0.09, 0.15
        ];
        keelVerts = [
          0, 0.05, 1.15,
          -0.14, 0.05, -0.95,
          0, -0.32, -0.85,

          0, 0.05, 1.15,
          0, -0.32, -0.85,
          0.14, 0.05, -0.95
        ];
      } else {
        // 'swallow' — Classic balanced paper airplane
        wingsVerts = [
          // Left wing
          0, 0.05, 1.25,
          -1.05, 0.15, -0.95,
          -0.13, 0.05, -0.95,
          // Right wing
          0, 0.05, 1.25,
          0.13, 0.05, -0.95,
          1.05, 0.15, -0.95
        ];
        keelVerts = [
          0, 0.05, 1.25,
          -0.13, 0.05, -0.95,
          0, -0.28, -0.95,

          0, 0.05, 1.25,
          0, -0.28, -0.95,
          0.13, 0.05, -0.95
        ];
      }

      const wingsMesh = new THREE.Mesh(makeWingGeo(wingsVerts), mainMat);
      wingsMesh.castShadow = true;
      wingsMesh.receiveShadow = true;

      const keelMesh = new THREE.Mesh(makeWingGeo(keelVerts), keelMat);
      keelMesh.castShadow = true;

      group.add(wingsMesh);
      group.add(keelMesh);

      // Subtle glowing nose beacon for high visibility against varied terrain
      const noseGeo = new THREE.ConeGeometry(0.06, 0.18, 6);
      noseGeo.rotateX(Math.PI / 2);
      const noseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const noseTip = new THREE.Mesh(noseGeo, noseMat);
      noseTip.position.set(0, 0.05, modelId === 'dart' ? 1.42 : modelId === 'glider' ? 1.02 : 1.2);
      group.add(noseTip);

      return group;
    }

    // Procedural Gradient Sky Dome

          float h = normalize(vWorldPosition).y;

    function spawnConfettiBurst(origin) {
      const colors = [0x38bdf8, 0xfbbf24, 0x34d399, 0xfb7185, 0xc084fc, 0xffffff];
      for (let i = 0; i < 65; i++) {

        confettiParticles.push({
          mesh: m,
          vel: new THREE.Vector3(Math.cos(angle) * speed, 7 + Math.random() * 10, Math.sin(angle) * speed),
          rotSpeed: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8),

    // Trajectory Preview Dotted Arc & Flight Ribbon Trail

    // Glowing 3D Landing Target Reticle on Ground/Green for Precision Approach

    // Active Paper Plane Mesh Holder

    // Ribbon trail line

    const trailMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });

    function resetTrail(pos) {
      for (let i = 0; i < trailMax; i++) {
        trailPositions[i * 3] = pos.x;
        trailPositions[i * 3 + 1] = pos.y;
        trailPositions[i * 3 + 2] = pos.z;
      }
      trailGeo.attributes.position.needsUpdate = true;
    }

    function pushTrailPoint(pos) {
      for (let i = trailMax - 1; i > 0; i--) {
        trailPositions[i * 3] = trailPositions[(i - 1) * 3];
        trailPositions[i * 3 + 1] = trailPositions[(i - 1) * 3 + 1];
        trailPositions[i * 3 + 2] = trailPositions[(i - 1) * 3 + 2];
      }
      trailPositions[0] = pos.x;
      trailPositions[1] = pos.y;
      trailPositions[2] = pos.z;
      trailGeo.attributes.position.needsUpdate = true;
    }

    // =========================================================================
    // 8. PROCEDURAL COURSE & 3D ENVIRONMENT GENERATOR
    // =========================================================================
    function generateCourseHoles(count) {
      const holes = [];
      for (let i = 0; i < count; i++) {
        const biome = BIOMES[i % BIOMES.length];
        // Progressive distance & elevation variety across natural valleys & hills
        const par = i % 3 === 0 ? 3 : i % 3 === 1 ? 4 : 5;
        const distance = par === 3 ? 95 + Math.random() * 35 : par === 4 ? 145 + Math.random() * 45 : 200 + Math.random() * 55;
        const lateralOffset = (Math.random() - 0.5) * (distance * 0.44);

        // Tee elevation vs Pin elevation
        let teeHeight = 16 + Math.random() * 14;
        let pinHeight = 5 + Math.random() * 10;

        if (biome.id === 'winter') {
          teeHeight = 25 + Math.random() * 14;
          pinHeight = 8 + Math.random() * 11;
        } else if (biome.id === 'autumn') {
          teeHeight = 20 + Math.random() * 12;
          pinHeight = 6 + Math.random() * 10;
        }

        const teePos = new THREE.Vector3(0, teeHeight, 0);
        const pinPos = new THREE.Vector3(lateralOffset, pinHeight, -distance);

        // Winding creek parameters (crossing or meandering through the valley)
        const hasCreek = (i % 2 === 1) || par >= 4;
        const creekZ = -distance * (0.42 + Math.random() * 0.24);
        const creekWidth = par === 3 ? 6.5 : 8.5;
        const creekCurveAmp = 10 + Math.random() * 10;
        const creekCurveFreq = 0.035 + Math.random() * 0.02;

        // Generate natural obstacles (trees & boulders) flanking the fairway
        const obstacles = [];
        const obsCount = par === 3 ? 6 : par === 4 ? 10 : 14;
        for (let o = 0; o < obsCount; o++) {
          const t = 0.14 + (o / obsCount) * 0.74 + (Math.random() - 0.5) * 0.06;
          const basePos = new THREE.Vector3().lerpVectors(teePos, pinPos, t);
          // Keep central flight corridor open & inviting while framing with nature
          const sideSign = o % 2 === 0 ? 1 : -1;
          const spread = (11 + Math.random() * 26) * sideSign;
          const ox = basePos.x + spread;
          const oz = basePos.z + (Math.random() - 0.5) * 14;

          // Avoid placing trees inside the winding creek
          if (hasCreek) {
            const creekCenterAtX = creekZ + Math.sin(ox * creekCurveFreq) * creekCurveAmp;
            if (Math.abs(oz - creekCenterAtX) < creekWidth * 0.85) continue;
          }

          let kind = 'oak';
          if (biome.id === 'winter') {
            kind = Math.random() > 0.25 ? 'snowpine' : 'boulder';
          } else if (biome.id === 'spring') {
            kind = Math.random() > 0.22 ? 'blossom' : 'boulder';
          } else if (biome.id === 'autumn') {
            kind = Math.random() > 0.35 ? 'autumn_tree' : (Math.random() > 0.4 ? 'pine' : 'boulder');
          } else {
            kind = Math.random() > 0.35 ? 'oak' : (Math.random() > 0.4 ? 'pine' : 'boulder');
          }

          obstacles.push({
            x: ox,
            z: oz,
            radius: kind === 'boulder' ? 2.4 + Math.random() * 2.2 : 3.2 + Math.random() * 3.0,
            height: kind === 'boulder' ? 3.5 + Math.random() * 3.5 : 10 + Math.random() * 11,
            kind
          });
        }

        // Gentle valley thermal updrafts on longer holes
        const thermals = [];
        if (par >= 4) {
          const mid = new THREE.Vector3().lerpVectors(teePos, pinPos, 0.5);
          thermals.push({
            x: mid.x + (Math.random() - 0.5) * 14,
            z: mid.z,
            radius: 9.5
          });
        }

        holes.push({
          number: i + 1,
          par,
          biome,
          teePos,
          pinPos,
          creek: hasCreek ? { z: creekZ, width: creekWidth, amp: creekCurveAmp, freq: creekCurveFreq } : null,
          obstacles,
          thermals,
          greenRadius: 11.5,
          cupRadius: 3.2
        });
      }
      return holes;
    }

    function clearCourseGroup() {
      while (courseGroup.children.length > 0) {
        const obj = courseGroup.children[0];
        courseGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
      }
      // Also clear any leftover confetti particles between holes
      while (confettiParticles.length > 0) {
        const c = confettiParticles.pop();
        confettiGroup.remove(c.mesh);
        c.mesh.geometry.dispose();
        c.mesh.material.dispose();
      }
    }

    /**
     * Evaluates terrain elevation and surface type (tee, green, cup, fairway, rooftop, water)
     * at any world (x, z) coordinate for consistent terrain rendering, trajectory prediction,
     * and collision detection.
     */
    function getSurfaceInfoAt(x, z, hole) {
      // 1. Check Target Cup & Green Pedestal
      const distToPin = Math.hypot(x - hole.pinPos.x, z - hole.pinPos.z);
      if (distToPin <= hole.cupRadius) {
        return { height: hole.pinPos.y + 0.25, surface: 'cup' };
      }
      if (distToPin <= hole.greenRadius) {
        return { height: hole.pinPos.y + 0.25, surface: 'green' };
      }

      // 2. Check Tee Box Pedestal
      const distToTee = Math.hypot(x - hole.teePos.x, z - hole.teePos.z);
      if (distToTee <= 8.2) {
        return { height: hole.teePos.y + 0.2, surface: 'tee' };
      }

      // 3. Seasonal Nature Biomes: Rolling fairway meadows, hills & winding creeks
      const totalZ = Math.min(-1, hole.pinPos.z);
      const t = THREE.MathUtils.clamp(z / totalZ, 0, 1);
      const centerX = THREE.MathUtils.lerp(hole.teePos.x, hole.pinPos.x, t);
      const lateralDist = Math.abs(x - centerX);

      const baseSlope = THREE.MathUtils.lerp(hole.teePos.y - 3.2, hole.pinPos.y - 2.0, t);
      const undulation = Math.sin(x * 0.065) * 2.0 + Math.cos(z * 0.05) * 2.3;
      const corridorHalfWidth = 34 + Math.sin(t * Math.PI) * 12;
      const edgeDrop = Math.max(0, lateralDist - corridorHalfWidth) * 0.55;

      let rawHeight = baseSlope + undulation - edgeDrop;

      // Carve winding creek bed if this hole features a stream
      if (hole.creek) {
        const creekCenterZ = hole.creek.z + Math.sin(x * hole.creek.freq) * hole.creek.amp;
        const distToCreek = Math.abs(z - creekCenterZ);
        if (distToCreek < hole.creek.width * 0.5) {
          return { height: Math.max(1.5, rawHeight - 2.6), surface: 'water' };
        }
        // Smooth grassy banks sloping down toward the creek
        if (distToCreek < hole.creek.width * 1.15) {
          const bankFactor = (distToCreek - hole.creek.width * 0.5) / (hole.creek.width * 0.65);
          rawHeight -= (1 - bankFactor) * 2.2;
        }
      }

      if (rawHeight <= 1.5) {
        return { height: 1.5, surface: 'water' };
      }
      return { height: rawHeight, surface: 'fairway' };
    }

    function buildHoleEnvironment(hole) {
      clearCourseGroup();
      currentHoleData = hole;

      const b = hole.biome;
      skyMat.uniforms.topColor.value.setHex(b.skyTop);
      skyMat.uniforms.bottomColor.value.setHex(b.skyBottom);
      scene.fog = new THREE.FogExp2(b.fogColor, b.fogDensity);
      hemiLight.color.setHex(b.ambientLight);
      sunLight.color.setHex(b.sunColor);

      // Base Lake / River Water Plane (frozen icy sheen in winter)
      const seaGeo = new THREE.PlaneGeometry(900, 900);
      seaGeo.rotateX(-Math.PI / 2);
      const seaMat = new THREE.MeshStandardMaterial({
        color: b.waterColor,
        roughness: b.id === 'winter' ? 0.14 : 0.22,
        metalness: b.id === 'winter' ? 0.45 : 0.32
      });
      const seaMesh = new THREE.Mesh(seaGeo, seaMat);
      seaMesh.position.y = 1.5;
      seaMesh.receiveShadow = true;
      courseGroup.add(seaMesh);

      // Build Rolling Seasonal Nature Terrain Mesh (Fields, Meadows, Creek Bed & Hills)
      const segX = 64;
      const segZ = 84;
      const width = 280;
      const depth = Math.abs(hole.pinPos.z) + 150;
      const centerZ = hole.pinPos.z * 0.5;

      const terrainGeo = new THREE.PlaneGeometry(width, depth, segX, segZ);
      terrainGeo.rotateX(-Math.PI / 2);
      terrainGeo.translate(hole.pinPos.x * 0.5, 0, centerZ);

      const posAttr = terrainGeo.attributes.position;
      const colors = [];
      const cGrass = new THREE.Color(b.groundColor);
      const cMeadowAlt = new THREE.Color(b.meadowAltColor);
      const cPeak = new THREE.Color(b.accentColor);
      const cSand = new THREE.Color(b.id === 'winter' ? 0x94a3b8 : 0xd6d3d1);

      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i);
        const vz = posAttr.getZ(i);
        const info = getSurfaceInfoAt(vx, vz, hole);
        let y = info.surface === 'water' ? 0.35 : info.height;

        // Add scenic rolling hills & mountain ridges framing the far sides of the valley
        const distFromCenter = Math.abs(vx - hole.pinPos.x * 0.5);
        if (distFromCenter > 50) {
          y += Math.pow((distFromCenter - 50) * 0.32, 1.32) + Math.abs(Math.sin(vz * 0.045)) * 10;
        }

        posAttr.setY(i, y);

        // Seasonal vertex coloring for fields, creek banks & distant hills
        const fieldWave = (Math.sin(vx * 0.08 + vz * 0.05) + 1) * 0.5;
        const baseFieldCol = cGrass.clone().lerp(cMeadowAlt, fieldWave);
        const col = y > 25 ? cPeak : (info.surface === 'water' || y < 2.2) ? cSand : baseFieldCol;
        colors.push(col.r, col.g, col.b);
      }
      terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      terrainGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.86,
        flatShading: true
      });
      const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
      terrainMesh.receiveShadow = true;
      courseGroup.add(terrainMesh);

      // Render Sparkling Winding Creek Ribbon when hole has a stream
      if (hole.creek) {
        const creekRibbonGeo = new THREE.PlaneGeometry(240, hole.creek.width, 64, 4);
        creekRibbonGeo.rotateX(-Math.PI / 2);
        const cPos = creekRibbonGeo.attributes.position;
        for (let i = 0; i < cPos.count; i++) {
          const cx = cPos.getX(i) + hole.pinPos.x * 0.5;
          const localZ = cPos.getZ(i);
          const wz = hole.creek.z + Math.sin(cx * hole.creek.freq) * hole.creek.amp + localZ;
          const bankInfo = getSurfaceInfoAt(cx, wz + hole.creek.width * 0.7, hole);
          cPos.setX(i, cx);
          cPos.setZ(i, wz);
          cPos.setY(i, Math.max(1.55, bankInfo.height - 1.25));
        }
        creekRibbonGeo.computeVertexNormals();
        const creekMat = new THREE.MeshStandardMaterial({
          color: b.waterColor,
          roughness: b.id === 'winter' ? 0.12 : 0.18,
          metalness: 0.4
        });
        const creekMesh = new THREE.Mesh(creekRibbonGeo, creekMat);
        creekMesh.receiveShadow = true;
        courseGroup.add(creekMesh);
      }

      // Build Tee Box Mound / Wooden Overlook Deck
      const teeHeight = hole.teePos.y;
      const teeGeo = new THREE.CylinderGeometry(8.5, 9.6, teeHeight, 24);
      const teeMat = new THREE.MeshStandardMaterial({
        color: b.id === 'winter' ? 0x64748b : 0x78716c,
        roughness: 0.78
      });
      const teeMesh = new THREE.Mesh(teeGeo, teeMat);
      teeMesh.position.set(hole.teePos.x, teeHeight * 0.5, hole.teePos.z);
      teeMesh.receiveShadow = true;
      teeMesh.castShadow = true;
      courseGroup.add(teeMesh);

      // Tee Top Turf
      const teeTopGeo = new THREE.CylinderGeometry(8.2, 8.2, 0.3, 24);
      const teeTopMat = new THREE.MeshStandardMaterial({
        color: b.id === 'winter' ? 0xe2e8f0 : b.id === 'autumn' ? 0xd97706 : 0x10b981,
        roughness: 0.65
      });
      const teeTop = new THREE.Mesh(teeTopGeo, teeTopMat);
      teeTop.position.set(hole.teePos.x, teeHeight + 0.05, hole.teePos.z);
      teeTop.receiveShadow = true;
      courseGroup.add(teeTop);

      // Build Target Green Mound & Glowing Landing Rings
      const pinH = hole.pinPos.y;
      const greenBaseGeo = new THREE.CylinderGeometry(hole.greenRadius + 2.2, hole.greenRadius + 3.6, pinH, 32);
      const greenBaseMat = new THREE.MeshStandardMaterial({
        color: 0x57534e,
        roughness: 0.78
      });
      const greenBase = new THREE.Mesh(greenBaseGeo, greenBaseMat);
      greenBase.position.set(hole.pinPos.x, pinH * 0.5, hole.pinPos.z);
      greenBase.receiveShadow = true;
      greenBase.castShadow = true;
      courseGroup.add(greenBase);

      // Lush Green Turf Disc
      const greenTopGeo = new THREE.CylinderGeometry(hole.greenRadius, hole.greenRadius, 0.35, 32);
      const greenTopMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.55 });
      const greenTop = new THREE.Mesh(greenTopGeo, greenTopMat);
      greenTop.position.set(hole.pinPos.x, pinH + 0.08, hole.pinPos.z);
      greenTop.receiveShadow = true;
      courseGroup.add(greenTop);

      // Glowing Outer Ring & Bullseye Inner Ring
      const outerRingGeo = new THREE.RingGeometry(hole.greenRadius - 0.5, hole.greenRadius, 40);
      outerRingGeo.rotateX(-Math.PI / 2);
      const outerRingMat = new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide });
      const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
      outerRing.position.set(hole.pinPos.x, pinH + 0.28, hole.pinPos.z);
      courseGroup.add(outerRing);

      const innerRingGeo = new THREE.RingGeometry(hole.cupRadius - 0.35, hole.cupRadius, 32);
      innerRingGeo.rotateX(-Math.PI / 2);
      const innerRingMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide });
      targetRingMesh = new THREE.Mesh(innerRingGeo, innerRingMat);
      targetRingMesh.position.set(hole.pinPos.x, pinH + 0.30, hole.pinPos.z);
      courseGroup.add(targetRingMesh);

      // Flagpole & Waving Pennant Flag
      const poleGeo = new THREE.CylinderGeometry(0.12, 0.12, 9.5, 8);
      const poleMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.6, roughness: 0.2 });
      const poleMesh = new THREE.Mesh(poleGeo, poleMat);
      poleMesh.position.set(hole.pinPos.x, pinH + 4.75, hole.pinPos.z);
      poleMesh.castShadow = true;
      courseGroup.add(poleMesh);

      const flagGeo = new THREE.PlaneGeometry(3.4, 1.8, 8, 2);
      flagGeo.translate(1.7, 0, 0);
      const flagMat = new THREE.MeshStandardMaterial({
        color: 0xf43f5e,
        side: THREE.DoubleSide,
        roughness: 0.5
      });
      flagClothMesh = new THREE.Mesh(flagGeo, flagMat);
      flagClothMesh.position.set(hole.pinPos.x, pinH + 8.4, hole.pinPos.z);
      courseGroup.add(flagClothMesh);

      // Build Seasonal Nature Obstacles (Blossom Trees, Oaks, Autumn Maples, Snow Pines, Boulders)
      hole.obstacles.forEach((obs) => {
        const groundInfo = getSurfaceInfoAt(obs.x, obs.z, hole);
        const baseY = Math.max(1.5, groundInfo.height);

        if (obs.kind === 'boulder') {
          const rockGeo = new THREE.DodecahedronGeometry(obs.radius * 0.9, 1);
          const rockMat = new THREE.MeshStandardMaterial({
            color: b.id === 'winter' ? 0xe2e8f0 : 0x78716c,
            roughness: 0.9,
            flatShading: true
          });
          const rock = new THREE.Mesh(rockGeo, rockMat);
          rock.position.set(obs.x, baseY + obs.radius * 0.45, obs.z);
          rock.scale.set(1.15, 0.85, 1.0);
          rock.castShadow = true;
          rock.receiveShadow = true;
          courseGroup.add(rock);
        } else if (obs.kind === 'pine' || obs.kind === 'snowpine') {
          const trunkGeo = new THREE.CylinderGeometry(0.4, 0.65, 3.2, 6);
          const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
          const trunk = new THREE.Mesh(trunkGeo, trunkMat);
          trunk.position.set(obs.x, baseY + 1.5, obs.z);
          courseGroup.add(trunk);

          const foliageColor = obs.kind === 'snowpine' ? 0x0f766e : 0x15803d;
          const foliageMat = new THREE.MeshStandardMaterial({ color: foliageColor, flatShading: true });
          const snowMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, flatShading: true });

          for (let tier = 0; tier < 3; tier++) {
            const tierRadius = obs.radius * (0.85 - tier * 0.2);
            const coneGeo = new THREE.ConeGeometry(tierRadius, 4.5, 7);
            const cone = new THREE.Mesh(coneGeo, foliageMat);
            cone.position.set(obs.x, baseY + 3.8 + tier * 2.4, obs.z);
            cone.castShadow = true;
            courseGroup.add(cone);

            if (obs.kind === 'snowpine') {
              const capGeo = new THREE.ConeGeometry(tierRadius * 0.62, 2.0, 7);
              const cap = new THREE.Mesh(capGeo, snowMat);
              cap.position.set(obs.x, baseY + 5.1 + tier * 2.4, obs.z);
              courseGroup.add(cap);
            }
          }
        } else {
          // Broadleaf Seasonal Trees: Spring Blossom, Summer Oak, or Autumn Golden Maple
          const trunkGeo = new THREE.CylinderGeometry(0.45, 0.72, 3.8, 7);
          const trunkMat = new THREE.MeshStandardMaterial({ color: 0x57534e });
          const trunk = new THREE.Mesh(trunkGeo, trunkMat);
          trunk.position.set(obs.x, baseY + 1.8, obs.z);
          courseGroup.add(trunk);

          let canopyColor = 0x22c55e;
          if (obs.kind === 'blossom') {
            canopyColor = Math.random() > 0.35 ? 0xf472b6 : 0xfbcfe8;
          } else if (obs.kind === 'autumn_tree') {
            const autumnPalette = [0xea580c, 0xd97706, 0xdc2626, 0xf59e0b];
            canopyColor = autumnPalette[Math.floor(Math.random() * autumnPalette.length)];
          } else {
            canopyColor = Math.random() > 0.4 ? 0x16a34a : 0x4d7c0f;
          }

          const crownGeo = new THREE.DodecahedronGeometry(obs.radius * 0.9, 1);
          const crownMat = new THREE.MeshStandardMaterial({
            color: canopyColor,
            flatShading: true
          });
          const crown = new THREE.Mesh(crownGeo, crownMat);
          crown.position.set(obs.x, baseY + 5.2, obs.z);
          crown.castShadow = true;
          courseGroup.add(crown);
        }
      });

      // Build Thermal Updraft Rings
      hole.thermals.forEach((th) => {
        for (let r = 0; r < 3; r++) {
          const rGeo = new THREE.RingGeometry(th.radius - 0.3, th.radius, 32);
          rGeo.rotateX(-Math.PI / 2);
          const rMat = new THREE.MeshBasicMaterial({
            color: 0x7dd3fc,
            transparent: true,
            opacity: 0.35 - r * 0.08,
            side: THREE.DoubleSide
          });
          const ring = new THREE.Mesh(rGeo, rMat);
          ring.position.set(th.x, hole.pinPos.y + 4 + r * 5, th.z);
          courseGroup.add(ring);
        }
      });
    }

    // =========================================================================
    // 9. ROUND, HOLE & TURN INITIALIZATION + HUD HELPERS
    // =========================================================================
    let bannerTimeout = null;

    function showBanner(text, duration = 1800) {
      const banner = document.getElementById('status-banner');
      if (!banner) return;
      banner.textContent = text;
      banner.classList.add('visible');
      if (bannerTimeout) clearTimeout(bannerTimeout);
      if (duration > 0) {
        bannerTimeout = setTimeout(() => {
          banner.classList.remove('visible');
        }, duration);
      }
    }

    function randomizeWindForHole(isMinorShift = false) {
      if (isMinorShift) {
        state.wind.angle += (Math.random() - 0.5) * 0.45;
        state.wind.speed = Math.max(1, Math.min(18, Math.round(state.wind.speed + (Math.random() - 0.5) * 3)));
      } else {
        state.wind.angle = Math.random() * Math.PI * 2;
        state.wind.speed = Math.floor(2 + Math.random() * 14);
      }
      state.wind.vec.set(
        Math.cos(state.wind.angle) * state.wind.speed,
        0,
        Math.sin(state.wind.angle) * state.wind.speed
      );
      updateWindHUD();
    }

    function updateWindHUD() {
      const speedEl = document.getElementById('hud-wind-speed');
      const arrowEl = document.getElementById('wind-arrow-wrap');
      if (speedEl) speedEl.textContent = state.wind.speed;
      if (arrowEl) {
        // Rotate arrow relative to player's current aim yaw
        const relAngleRad = state.wind.angle + Math.PI * 0.5 + state.aim.yaw;
        arrowEl.style.transform = `rotate(${THREE.MathUtils.radToDeg(relAngleRad)}deg)`;
      }
    }

    function syncPrecisionModeForDistance(distMeters) {
      const autoActive = distMeters <= 38;
      state.aim.precisionMode = state.aim.precisionOverride !== null ? state.aim.precisionOverride : autoActive;
      const btn = document.getElementById('btn-precision');
      const lbl = document.getElementById('precision-label');
      if (btn && lbl) {
        if (state.aim.precisionMode) {
          btn.classList.add('active');
          lbl.textContent = state.aim.precisionOverride !== null ? 'APPROACH: ON' : 'APPROACH: AUTO';
        } else {
          btn.classList.remove('active');
          lbl.textContent = state.aim.precisionOverride !== null ? 'APPROACH: OFF' : 'FULL DRIVE';
        }
      }
    }

    function startNewRound() {
      sound.init();
      sound.playClick(740);

      for (let i = 0; i < state.playerCount; i++) {
        const p = state.players[i];
        p.scores = new Array(state.totalHoles).fill(null);
        p.holedOut = false;
        p.strokesThisHole = 0;
      }

      state.holes = generateCourseHoles(state.totalHoles);
      document.getElementById('hud-hole-total').textContent = state.totalHoles;
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');

      setupHole(0);
    }

    function setupHole(holeIdx) {
      state.currentHoleIndex = holeIdx;
      const hole = state.holes[holeIdx];
      buildHoleEnvironment(hole);
      randomizeWindForHole(false);

      for (let i = 0; i < state.playerCount; i++) {
        const p = state.players[i];
        p.lie.set(hole.teePos.x, hole.teePos.y + 1.15, hole.teePos.z);
        p.holedOut = false;
        p.strokesThisHole = 0;
      }

      // Golf Honors: lowest score on previous hole tees off first
      let starterIdx = 0;
      if (holeIdx > 0 && state.playerCount > 1) {
        let bestPrev = Infinity;
        for (let i = 0; i < state.playerCount; i++) {
          const prevScore = state.players[i].scores[holeIdx - 1] || 99;
          if (prevScore < bestPrev) {
            bestPrev = prevScore;
            starterIdx = i;
          }
        }
      }

      state.currentPlayerIndex = starterIdx;
      document.getElementById('hud-biome-name').textContent = hole.biome.name;
      document.getElementById('hud-hole-num').textContent = hole.number;
      document.getElementById('hud-par').textContent = hole.par;

      preparePlayerTurn();
    }

    function preparePlayerTurn() {
      const hole = state.holes[state.currentHoleIndex];
      const player = state.players[state.currentPlayerIndex];
      const model = PLANE_MODELS[player.modelId];
      const color = PLANE_COLORS[player.colorIdx];

      state.phase = 'AIMING';
      state.aim.power = 0;
      state.aim.isDragging = false;
      state.aim.precisionOverride = null;

      // Aim directly toward pin by default
      const dx = hole.pinPos.x - player.lie.x;
      const dz = hole.pinPos.z - player.lie.z;
      state.aim.yaw = Math.atan2(-dx, -dz);

      const distMeters = Math.round(Math.hypot(dx, dz));
      syncPrecisionModeForDistance(distMeters);

      // Default launch pitch adapts to approach vs full drive
      state.aim.pitchDeg = state.aim.precisionMode ? 12 : 16;
      const pitchSliderEl = document.getElementById('pitch-slider');
      if (pitchSliderEl) pitchSliderEl.value = state.aim.pitchDeg;
      document.getElementById('hud-pitch-val').textContent = `${state.aim.pitchDeg}°`;
      document.getElementById('hud-power-val').textContent = '0%';

      // Rebuild active paper plane mesh for current player
      if (activePlaneMesh) {
        scene.remove(activePlaneMesh);
      }
      activePlaneMesh = createPaperPlaneMesh(player.modelId, color.hex, color.crease);
      activePlaneMesh.position.copy(player.lie);
      activePlaneMesh.rotation.set(-THREE.MathUtils.degToRad(state.aim.pitchDeg), state.aim.yaw + Math.PI, 0, 'YXZ');
      scene.add(activePlaneMesh);

      resetTrail(player.lie);

      // Update HUD Player & Distance info
      document.getElementById('hud-dist').textContent = distMeters;
      document.getElementById('hud-player-name').textContent = player.name;
      document.getElementById('hud-plane-model').textContent = model.name;
      document.getElementById('hud-player-dot').style.background = color.hex;
      document.getElementById('hud-stroke').textContent = player.strokesThisHole + 1;

      const telemetry = document.getElementById('launch-telemetry');
      if (telemetry) telemetry.classList.remove('hidden-panel');

      updateWindHUD();
      updateTrajectoryPreview();
      showBanner(`${player.name}'s Turn — Swipe Up to Throw`, 1800);
    }

    // =========================================================================
    // 10. TRAJECTORY PREDICTION & LAUNCH EXECUTION
    // =========================================================================
    function computeLaunchVelocity(powerRatio) {
      const player = state.players[state.currentPlayerIndex];
      const model = PLANE_MODELS[player.modelId];

      const effectivePower = state.aim.precisionMode
        ? (0.15 + powerRatio * 0.50)
        : (0.28 + powerRatio * 0.72);

      const baseSpeed = 38.0 * effectivePower * model.speedMult;
      const pitchRad = THREE.MathUtils.degToRad(state.aim.pitchDeg);
      const horizSpeed = Math.cos(pitchRad) * baseSpeed;

      return new THREE.Vector3(
        -Math.sin(state.aim.yaw) * horizSpeed,
        Math.sin(pitchRad) * baseSpeed,
        -Math.cos(state.aim.yaw) * horizSpeed
      );
    }

    function updateTrajectoryPreview() {
      if (state.phase !== 'AIMING' || !currentHoleData) {
        previewDots.forEach(d => { d.visible = false; });
        landingMarkerGroup.visible = false;
        return;
      }

      const hole = currentHoleData;
      const player = state.players[state.currentPlayerIndex];
      const model = PLANE_MODELS[player.modelId];
      const previewPower = state.aim.power > 0.04 ? state.aim.power : 0.45;

      const simPos = player.lie.clone();
      const simVel = computeLaunchVelocity(previewPower);
      const simDt = 0.065;
      let landedPoint = null;

      for (let i = 0; i < previewDots.length; i++) {
        const horizSpeed = Math.hypot(simVel.x, simVel.z);
        const liftAccel = Math.min(8.85, horizSpeed * 0.25 * model.liftMult);
        let verticalAccel = -9.81 + liftAccel;

        for (const th of hole.thermals) {
          if (Math.hypot(simPos.x - th.x, simPos.z - th.z) <= th.radius) {
            verticalAccel += 7.5;
          }
        }

        simVel.y += verticalAccel * simDt;
        simVel.addScaledVector(state.wind.vec, 0.16 * model.windSensitivity * simDt);
        const dragFactor = Math.max(0, 1 - 0.16 * model.dragMult * simDt);
        simVel.multiplyScalar(dragFactor);
        if (simVel.y < -9.5) simVel.y = THREE.MathUtils.lerp(simVel.y, -9.5, simDt * 1.5);

        simPos.addScaledVector(simVel, simDt);

        const surf = getSurfaceInfoAt(simPos.x, simPos.z, hole);
        const dot = previewDots[i];
        dot.position.copy(simPos);
        dot.material.color.setHex(state.aim.precisionMode ? 0x34d399 : 0x38bdf8);
        dot.visible = true;

        if (simPos.y <= surf.height + 0.35) {
          landedPoint = new THREE.Vector3(simPos.x, surf.height + 0.35, simPos.z);
          for (let j = i + 1; j < previewDots.length; j++) {
            previewDots[j].visible = false;
          }
          break;
        }
      }

      if (landedPoint) {
        landingMarkerGroup.visible = true;
        landingMarkerGroup.position.copy(landedPoint);
        const distToPin = Math.hypot(landedPoint.x - hole.pinPos.x, landedPoint.z - hole.pinPos.z);
        const inCupZone = distToPin <= hole.cupRadius * 1.25;
        landingOuterRing.material.color.setHex(inCupZone ? 0xfbbf24 : 0x34d399);
      } else {
        landingMarkerGroup.visible = false;
      }
    }

    function launchPaperPlane() {
      if (state.phase !== 'AIMING') return;

      const player = state.players[state.currentPlayerIndex];
      player.strokesThisHole += 1;
      document.getElementById('hud-stroke').textContent = player.strokesThisHole;

      const launchVel = computeLaunchVelocity(state.aim.power);

      state.flight.pos.copy(player.lie);
      state.flight.prevSafeLie.copy(player.lie);
      state.flight.vel.copy(launchVel);
      state.flight.timeInAir = 0;

      state.phase = 'FLYING';
      previewDots.forEach(d => { d.visible = false; });
      landingMarkerGroup.visible = false;

      const telemetry = document.getElementById('launch-telemetry');
      if (telemetry) telemetry.classList.add('hidden-panel');

      resetTrail(player.lie);
      sound.playWhoosh(state.aim.power);
      sound.startFlightWind();
    }

    function buildScorecardTableHTML() {
      let html = '<thead><tr><th style="text-align:left;">Player</th>';
      for (let h = 0; h < state.totalHoles; h++) {
        html += `<th>H${h + 1}</th>`;
      }
      html += '<th>TOT</th><th>+/-</th></tr></thead><tbody>';

      // Par reference row
      let totalPar = 0;
      html += '<tr style="background: rgba(255,255,255,0.04);"><td style="text-align:left; font-weight:700; color:#fbbf24;">PAR</td>';
      for (let h = 0; h < state.totalHoles; h++) {
        const par = state.holes[h] ? state.holes[h].par : 3;
        totalPar += par;
        html += `<td class="text-gold font-bold">${par}</td>`;
      }
      html += `<td class="text-gold font-extrabold">${totalPar}</td><td>—</td></tr>`;

      // Player rows
      for (let i = 0; i < state.playerCount; i++) {
        const p = state.players[i];
        const col = PLANE_COLORS[p.colorIdx].hex;
        let sum = 0;
        let parPlayed = 0;
        html += `<tr><td style="text-align:left; font-weight:700; white-space:nowrap;">
          <span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:${col}; margin-right:6px;"></span>${p.name}
        </td>`;

        for (let h = 0; h < state.totalHoles; h++) {
          const sc = p.scores[h];
          const holePar = state.holes[h] ? state.holes[h].par : 3;
          if (sc !== null && sc !== undefined) {
            sum += sc;
            parPlayed += holePar;
            const cls = sc < holePar ? 'score-under' : sc > holePar ? 'score-over' : 'score-even';
            html += `<td class="${cls}">${sc}</td>`;
          } else {
            html += '<td class="text-muted">-</td>';
          }
        }

        const diff = sum - parPlayed;
        const diffStr = parPlayed === 0 ? 'E' : diff === 0 ? 'E' : diff > 0 ? `+${diff}` : `${diff}`;
        const diffCls = diff < 0 ? 'score-under' : diff > 0 ? 'score-over' : 'score-even';
        html += `<td class="font-extrabold">${sum}</td><td class="${diffCls}">${diffStr}</td></tr>`;
      }

      html += '</tbody>';
      return html;
    }

    // =========================================================================
    // 11. UNIFIED TOUCH & MOUSE FORWARD SWIPE THROW + CAMERA SURVEY HANDLERS
    // =========================================================================
    const slingGroup = document.getElementById('sling-group');
    const slingAnchor = document.getElementById('sling-anchor');
    const slingLine = document.getElementById('sling-line');
    const slingKnob = document.getElementById('sling-knob');

    let baseYawAtDragStart = 0;
    let swipeStartTime = 0;
    let swipeSamples = [];

    function updateSlingVisuals() {
      if (!state.aim.isDragging) {
        slingGroup.style.display = 'none';
        return;
      }
      slingGroup.style.display = 'block';
      slingAnchor.setAttribute('cx', state.aim.dragStartX);
      slingAnchor.setAttribute('cy', state.aim.dragStartY);
      slingLine.setAttribute('x1', state.aim.dragStartX);
      slingLine.setAttribute('y1', state.aim.dragStartY);
      slingLine.setAttribute('x2', state.aim.dragCurrX);
      slingLine.setAttribute('y2', state.aim.dragCurrY);
      slingKnob.setAttribute('cx', state.aim.dragCurrX);
      slingKnob.setAttribute('cy', state.aim.dragCurrY);
    }

    function handlePointerDown(clientX, clientY) {
      sound.init();
      if (state.cameraSurvey.active) {
        state.cameraSurvey.isPanning = true;
        state.cameraSurvey.lastX = clientX;
        state.cameraSurvey.lastY = clientY;
        return;
      }

      if (state.phase !== 'AIMING') return;

      state.aim.isDragging = true;
      state.aim.dragStartX = clientX;
      state.aim.dragStartY = clientY;
      state.aim.dragCurrX = clientX;
      state.aim.dragCurrY = clientY;
      state.aim.power = 0;
      baseYawAtDragStart = state.aim.yaw;
      swipeStartTime = performance.now();
      swipeSamples = [{ x: clientX, y: clientY, t: swipeStartTime }];
      updateSlingVisuals();
    }

    function handlePointerMove(clientX, clientY) {
      if (state.cameraSurvey.active && state.cameraSurvey.isPanning) {
        const dx = clientX - state.cameraSurvey.lastX;
        const dy = clientY - state.cameraSurvey.lastY;
        state.cameraSurvey.lastX = clientX;
        state.cameraSurvey.lastY = clientY;
        state.cameraSurvey.yawOffset -= dx * 0.007;
        state.cameraSurvey.pitchOffset = Math.max(0.08, Math.min(1.25, state.cameraSurvey.pitchOffset + dy * 0.006));
        return;
      }

      if (!state.aim.isDragging || state.phase !== 'AIMING') return;

      const now = performance.now();
      state.aim.dragCurrX = clientX;
      state.aim.dragCurrY = clientY;
      swipeSamples.push({ x: clientX, y: clientY, t: now });
      if (swipeSamples.length > 8) swipeSamples.shift();

      const dx = clientX - state.aim.dragStartX;
      const forwardDy = state.aim.dragStartY - clientY; // Swiping UP/FORWARD on screen (> 0)

      // Forward swipe distance + flick velocity combined for responsive control on touch & mouse
      const maxSwipe = Math.min(240, window.innerHeight * 0.32);
      const distRatio = Math.min(1, Math.max(0, forwardDy) / maxSwipe);

      let flickBoost = 0;
      if (swipeSamples.length >= 2) {
        const first = swipeSamples[0];
        const last = swipeSamples[swipeSamples.length - 1];
        const dtMs = Math.max(16, last.t - first.t);
        const vyPxPerSec = ((first.y - last.y) / dtMs) * 1000;
        if (vyPxPerSec > 350) {
          flickBoost = Math.min(0.32, ((vyPxPerSec - 350) / 2200) * 0.32);
        }
      }

      const power = forwardDy > 8 ? Math.min(1, distRatio * 0.82 + flickBoost) : 0;
      state.aim.power = power;

      // Natural forward swipe steering: swiping right aims right (-yaw), swiping left aims left (+yaw)
      const yawDelta = -(dx / Math.max(160, window.innerWidth * 0.36)) * 1.15;
      state.aim.yaw = baseYawAtDragStart + yawDelta;

      // Update UI Telemetry
      const displayedPower = state.aim.precisionMode
        ? Math.round((0.15 + power * 0.50) * 100)
        : Math.round(power * 100);
      document.getElementById('hud-power-val').textContent = `${displayedPower}%`;
      updateWindHUD();
      updateSlingVisuals();
      updateTrajectoryPreview();

      // Orient plane mesh smoothly while aiming
      if (activePlaneMesh) {
        activePlaneMesh.rotation.set(-THREE.MathUtils.degToRad(state.aim.pitchDeg), state.aim.yaw + Math.PI, -yawDelta * 0.35, 'YXZ');
      }
    }

    function handlePointerUp() {
      if (state.cameraSurvey.isPanning) {
        state.cameraSurvey.isPanning = false;
      }

      if (!state.aim.isDragging) return;
      state.aim.isDragging = false;
      updateSlingVisuals();

      if (state.phase === 'AIMING') {
        const forwardDy = state.aim.dragStartY - state.aim.dragCurrY;
        if (forwardDy > 14 && state.aim.power >= 0.08) {
          launchPaperPlane();
        } else {
          state.aim.power = 0;
          document.getElementById('hud-power-val').textContent = '0%';
          updateTrajectoryPreview();
          if (forwardDy < -12) {
            showBanner('Swipe UP / forward to launch!', 1400);
          }
        }
      }
    }

    // Mouse Listeners on Canvas
    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      handlePointerDown(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', () => handlePointerUp());
    window.addEventListener('blur', () => {
      if (state.aim.isDragging) {
        state.aim.isDragging = false;
        state.aim.power = 0;
        updateSlingVisuals();
        updateTrajectoryPreview();
      }
    });

    // Touch Listeners on Canvas (including 2-finger pinch zoom in Survey mode)
    let initialPinchDist = null;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
      } else if (e.touches.length === 2) {
        state.aim.isDragging = false;
        updateSlingVisuals();
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      } else if (e.touches.length === 2 && initialPinchDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = initialPinchDist / Math.max(10, dist);
        state.cameraSurvey.zoom = Math.max(0.55, Math.min(2.2, state.cameraSurvey.zoom * scale));
        initialPinchDist = dist;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      initialPinchDist = null;
      handlePointerUp();
    });
    window.addEventListener('touchcancel', () => {
      initialPinchDist = null;
      state.aim.isDragging = false;
      updateSlingVisuals();
    });

    // Desktop Mouse Wheel Zoom in Survey Mode
    canvas.addEventListener('wheel', (e) => {
      if (state.cameraSurvey.active) {
        state.cameraSurvey.zoom = Math.max(0.55, Math.min(2.4, state.cameraSurvey.zoom + e.deltaY * 0.001));
      }
    }, { passive: true });

    // Pitch Slider Control
    const pitchSlider = document.getElementById('pitch-slider');
    pitchSlider.addEventListener('input', (e) => {
      state.aim.pitchDeg = parseInt(e.target.value, 10);
      document.getElementById('hud-pitch-val').textContent = `${state.aim.pitchDeg}°`;
      if (activePlaneMesh && state.phase === 'AIMING') {
        activePlaneMesh.rotation.set(-THREE.MathUtils.degToRad(state.aim.pitchDeg), state.aim.yaw + Math.PI, 0, 'YXZ');
      }
      updateTrajectoryPreview();
    });

    // =========================================================================
    // 12. HUD BUTTONS & MODALS (Survey, Scorecard, Audio, Summary)
    // =========================================================================
    document.getElementById('btn-start-game').addEventListener('click', startNewRound);

    document.getElementById('btn-precision').addEventListener('click', () => {
      sound.playClick(690);
      if (state.phase !== 'AIMING') return;
      state.aim.precisionOverride = !state.aim.precisionMode;
      const hole = state.holes[state.currentHoleIndex];
      const player = state.players[state.currentPlayerIndex];
      const distMeters = Math.round(Math.hypot(hole.pinPos.x - player.lie.x, hole.pinPos.z - player.lie.z));
      syncPrecisionModeForDistance(distMeters);
      updateTrajectoryPreview();
      showBanner(state.aim.precisionMode ? 'Precision Approach Enabled (15–65% Power)' : 'Full Drive Mode Enabled', 1500);
    });

    document.getElementById('btn-survey').addEventListener('click', () => {
      sound.playClick(640);
      state.cameraSurvey.active = !state.cameraSurvey.active;
      const btn = document.getElementById('btn-survey');
      if (state.cameraSurvey.active) {
        btn.classList.add('survey-active');
        state.cameraSurvey.yawOffset = 0;
        state.cameraSurvey.pitchOffset = 0.35;
        state.cameraSurvey.zoom = 1.0;
        showBanner('Survey Mode: Drag to orbit camera', 2200);
      } else {
        btn.classList.remove('survey-active');
        showBanner('Aim Mode Ready', 1200);
      }
    });

    document.getElementById('btn-audio').addEventListener('click', () => {

      document.getElementById('icon-sound-off').style.display = muted ? 'block' : 'none';
      if (!muted) sound.playClick(700);
    });

    // Tapping Mini-Map toggles Survey View for quick full-course inspection
    document.getElementById('minimap-container').addEventListener('click', () => {
      document.getElementById('btn-survey').click();
    });

    document.getElementById('btn-scorecard').addEventListener('click', () => {
      sound.playClick(600);
      const hole = state.holes[state.currentHoleIndex];
      document.getElementById('scorecard-subtitle').textContent = `Hole ${hole ? hole.number : 1} of ${state.totalHoles}`;
      document.getElementById('scorecard-table').innerHTML = buildScorecardTableHTML();
      document.getElementById('scorecard-modal').classList.remove('hidden');
    });

    document.getElementById('btn-close-scorecard').addEventListener('click', () => {

      document.getElementById('scorecard-modal').classList.add('hidden');
    });

    document.getElementById('btn-next-hole').addEventListener('click', () => {

      document.getElementById('summary-modal').classList.add('hidden');
